# Netlify configuration for the client onboarding site.
#
# publish is declared here (not just in the UI) so the correct directory is
# version-controlled. Setting it to "deploy" instead would relocate every
# client page to /uo-onboarding/<slug>/ and break links already sent out.

[build]
  publish = "deploy/uo-onboarding"

# Password gate for the team library. Guards the root and its manifest only —
# client pages at /<slug>/ stay public so clients can open their own links.
# Requires the LIBRARY_PASSWORD environment variable; fails closed without it.

[[edge_functions]]
  function = "library-gate"
  path = "/"

[[edge_functions]]
  function = "library-gate"
  path = "/pages.json"
