e=\"margin:0 0 6px\">Video Sales Letter script<\u002Fli><li style=\"margin:0 0 6px\">Full VSL edit<\u002Fli><li style=\"margin:0 0 6px\">Thank You Page script<\u002Fli><li style=\"margin:0 0 6px\">Thank You Page edit<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Funnel Build<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Funnel page creation<\u002Fli><li style=\"margin:0 0 6px\">Funnel copywriting<\u002Fli><li style=\"margin:0 0 6px\">Qualification questions<\u002Fli><li style=\"margin:0 0 6px\">Disqualification logic<\u002Fli><li style=\"margin:0 0 6px\">Split test setup<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">CRM &amp; Automation<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">CRM Pipeline setup<\u002Fli><li style=\"margin:0 0 6px\">Opportunity stages<\u002Fli><li style=\"margin:0 0 6px\">Lead workflows<\u002Fli><li style=\"margin:0 0 6px\">Email nurture campaigns<\u002Fli><li style=\"margin:0 0 6px\">SMS nurture campaigns (subject to A2P approval)<\u002Fli><li style=\"margin:0 0 6px\">AI Lead Follow-Up System<\u002Fli><li style=\"margin:0 0 6px\">AI Social Media Follow-Up System<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Technical Setup<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Domain connection<\u002Fli><li style=\"margin:0 0 6px\">Tracking dashboard<\u002Fli><li style=\"margin:0 0 6px\">Sales dashboard<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Creative<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Fifteen (15) video advertisement scripts<\u002Fli><li style=\"margin:0 0 6px\">Editing guidance<\u002Fli><li style=\"margin:0 0 6px\">Ten (10) static advertisements<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Training<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Full walkthrough of every system<\u002Fli><li style=\"margin:0 0 6px\">Training on operation and management<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Support<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Thirty (30) days Slack support following completion<\u002Fli><\u002Ful>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">WHAT IS NOT INCLUDED<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Unless specifically agreed in writing, the following services are not included within Unorthodox Systems.<\u002Fp>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Paid advertising management, Meta Ads optimisation, Google Ads optimisation<\u002Fli><li style=\"margin:0 0 6px\">Media buying, Campaign management, Advertising spend<\u002Fli><li style=\"margin:0 0 6px\">Ongoing funnel optimisation, Ongoing copywriting<\u002Fli><li style=\"margin:0 0 6px\">Sales coaching<\u002Fli><li style=\"margin:0 0 6px\">Sales management, Appointment setting<\u002Fli><li style=\"margin:0 0 6px\">Lead follow-up by humans<\u002Fli><li style=\"margin:0 0 6px\">Closing sales<\u002Fli><li style=\"margin:0 0 6px\">Product fulfilment<\u002Fli><li style=\"margin:0 0 6px\">Third-party software subscriptions<\u002Fli><li style=\"margin:0 0 6px\">Professional filming, Voice-over talent<\u002Fli><li style=\"margin:0 0 6px\">Photography<\u002Fli><li style=\"margin:0 0 6px\">Graphic design outside the agreed scope<\u002Fli><li style=\"margin:0 0 6px\">Legal, financial or compliance advice<\u002Fli><\u002Ful>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">PROJECT TIMELINES<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Implementation time varies depending upon project complexity and the speed at which required information is supplied.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Typical implementation ranges between 14 and 45 business days, however this is not guaranteed.<\u002Fp>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">VSL recordings<\u002Fli><li style=\"margin:0 0 6px\">Testimonials<\u002Fli><li style=\"margin:0 0 6px\">Branding<\u002Fli><li style=\"margin:0 0 6px\">Account access<\u002Fli><li style=\"margin:0 0 6px\">Feedback<\u002Fli><li style=\"margin:0 0 6px\">Approvals<\u002Fli><li style=\"margin:0 0 6px\">Third-party platform approvals<\u002Fli><\u002Ful>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">CLIENT RESPONSIBILITIES<\u002Fh3>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Provide Required Information: Supply requested information accurately and promptly.<\u002Fli><li style=\"margin:0 0 6px\">Provide Assets: Provide logos, branding, testimonials, videos and other requested materials.<\u002Fli><li style=\"margin:0 0 6px\">Record Requested Content: Record Video Sales Letters and advertisements where required.<\u002Fli><li style=\"margin:0 0 6px\">Provide Platform Access: Grant access to advertising accounts, domains, CRM systems, calendars and associated software.<\u002Fli><li style=\"margin:0 0 6px\">Provide Feedback: Review submitted work and provide consolidated feedback within a reasonable timeframe.<\u002Fli><li style=\"margin:0 0 6px\">Approvals: Approve work before implementation.<\u002Fli><li style=\"margin:0 0 6px\">System Integrity: Not materially alter the implemented systems during the build process without discussing changes with Unorthodox.<\u002Fli><\u002Ful>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">INVESTMENT<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">The investment for Unorthodox Systems is:<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Paid In Full — $5,997 USD. Or Split Payment — 2 payments of $3,500 USD.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">The split payment option is provided solely as a financing option and does not represent an ongoing monthly service.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">All prices are exclusive of VAT which will be charged where legally required. Failure to make payments when due may result in work being paused until outstanding balances have been settled.<\u002Fp>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">COMPLETION OF SERVICES<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">The service shall be deemed practically complete once all agreed deliverables have been supplied, the system walkthrough has been delivered, and thirty (30) days of included Slack support have expired. Minor bug fixes discovered during this support period will be corrected without charge. Requests for additional functionality or changes outside the agreed scope may be quoted separately.<\u002Fp>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">OPTIONAL ONGOING SUPPORT<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Following completion, Clients may choose to continue with the Unorthodox Systems Support &amp; Maintenance Plan. Current pricing: $950 USD per month.<\u002Fp>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Technical support<\u002Fli><li style=\"margin:0 0 6px\">Minor system updates<\u002Fli><li style=\"margin:0 0 6px\">Bug fixes<\u002Fli><li style=\"margin:0 0 6px\">AI workflow monitoring<\u002Fli><li style=\"margin:0 0 6px\">Slack support<\u002Fli><li style=\"margin:0 0 6px\">Up to one scheduled support call per month (where applicable)<\u002Fli><\u002Ful>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">REFUNDS<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Due to the bespoke nature of the work undertaken, all payments are non-refundable once work has commenced. The Client acknowledges that significant strategic, technical and creative work begins immediately following onboarding.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">If the Client chooses not to complete the implementation, pauses the project indefinitely, or otherwise elects not to proceed after work has commenced, no refund shall be due for work already completed. Nothing in this Agreement affects the Client's statutory rights where applicable.<\u002Fp>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">LIMITATION OF LIABILITY<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Unorthodox will exercise reasonable skill and care in delivering the services described within this Agreement. However, Unorthodox does not guarantee any specific business outcome, including but not limited to revenue or profit, lead or appointment volume, sales or return on investment. Business performance depends upon numerous factors outside the control of Unorthodox including advertising execution, market conditions, pricing, sales ability, fulfilment quality and operational execution.<\u002Fp>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">INTELLECTUAL PROPERTY<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Upon receipt of all payments due under this Agreement, ownership of the bespoke assets created specifically for the Client (including copy, funnels, workflows and creative assets) transfers to the Client. Unorthodox retains ownership of its proprietary methodologies, templates, frameworks, software configurations, AI systems, internal processes and intellectual property developed independently of the Client's project.<\u002Fp>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">ACCEPTANCE<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">By signing below, or by paying the first invoice, both parties confirm that they have read, understood and agree to the terms contained within this Agreement.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">This Agreement shall be governed by the laws of England and Wales.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ notSigned }}\" hint-placeholder-val=\"{{ true }}\">\n              <div class=\"noprint\" style=\"border-top:1px solid rgba(11,12,16,0.09);padding-top:22px;display:flex;flex-direction:column;gap:16px\">\n                <div><div style=\"font-size:15px;font-weight:600;margin-bottom:6px\">Sign here<\u002Fdiv><p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58);max-width:58ch\">Read the agreement above, then sign below. Your signature is captured here on the page and we both keep a copy.<\u002Fp><\u002Fdiv>\n                <label style=\"display:flex;flex-direction:column;gap:9px;max-width:420px\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.42)\">Type your full legal name<\u002Fspan>\n                  <input type=\"text\" value=\"{{ sigDraft }}\" sc-camel-on-change=\"{{ onSigDraft }}\" placeholder=\"Megan Harrington\" style=\"width:100%;font-size:14px;padding:13px 15px;border:1px solid rgba(11,12,16,0.16);border-radius:3px;background:#FBFBFC;color:#0B0C10\" style-focus=\"outline:none;border-color:#0031FF;background:#FFFFFF\">\n                <\u002Flabel>\n                <label style=\"display:flex;gap:12px;align-items:flex-start;cursor:pointer;max-width:60ch\">\n                  <input type=\"checkbox\" checked=\"{{ agreed }}\" sc-camel-on-change=\"{{ onAgreed }}\" style=\"margin:3px 0 0;width:17px;height:17px;accent-color:#0031FF;flex:none;cursor:pointer\">\n                  <span style=\"font-size:14px;line-height:1.6;color:rgba(11,12,16,0.7)\">I have read the agreement above and I accept it on behalf of Zestful Media &amp; Design. I understand that typing my name here is a legally binding electronic signature.<\u002Fspan>\n                <\u002Flabel>\n                <button type=\"button\" sc-camel-on-click=\"{{ sign }}\" disabled=\"{{ signDisabled }}\" style=\"{{ signBtnStyle }}\">Sign agreement<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ signed }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-top:1px solid rgba(11,12,16,0.09);padding-top:22px;display:flex;flex-direction:column;gap:18px\">\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px 30px\">\n                  <div style=\"display:flex;flex-direction:column;gap:8px\">\n                    <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.42)\">Signed by<\u002Fdiv>\n                    <div style=\"font-size:26px;line-height:1.2;font-family:'JetBrains Mono',monospace;color:#0031FF\">{{ sigName }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:8px\">\n                    <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.42)\">Signed on<\u002Fdiv>\n                    <div style=\"font-size:15px;line-height:1.5\">{{ sigWhen }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <p style=\"margin:0;font-size:13px;line-height:1.6;color:rgba(11,12,16,0.5)\">Accepted electronically on this page. A copy of this record is held by both parties and is available to Unorthodox Digital Ltd on request.<\u002Fp>\n                <button type=\"button\" sc-camel-on-click=\"{{ downloadPdf }}\" class=\"noprint\" style=\"align-self:flex-start;font-family:'Archivo',sans-serif;font-size:14px;font-weight:500;padding:12px 20px;border-radius:3px;border:1px solid rgba(11,12,16,0.16);background:#FFFFFF;color:#0B0C10;cursor:pointer\" style-hover=\"border-color:#0031FF;color:#0031FF\">Download the signed PDF<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section>\n      <div style=\"display:flex;gap:22px;align-items:flex-start;margin-bottom:34px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:#0031FF;padding-top:9px;flex:none;letter-spacing:0.06em\">02<\u002Fdiv>\n        <div>\n          <h2 style=\"margin:0;font-size:34px;font-weight:700;letter-spacing:-0.03em;line-height:1.1\">Book your strategy call with Liam<\u002Fh2>\n          <p style=\"margin:16px 0 0;font-size:17px;line-height:1.6;color:rgba(11,12,16,0.62);max-width:58ch\">First thing, let's get you booked in with Liam. It's 30 mins and he'll be running an initial business audit, building you out a funnel plan, finding any quick wins, and giving you access to our training and resources.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#FFFFFF;border:1px solid rgba(11,12,16,0.09);border-radius:4px;padding:4px 30px 26px\">\n        <div style=\"display:flex;gap:18px;align-items:flex-start;padding:26px 0 8px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggle.sc1 }}\" aria-pressed=\"{{ pressed.sc1 }}\" aria-label=\"{{ boxLabel.sc1 }}\" style=\"flex:none;position:relative;width:28px;height:28px;margin-top:2px;border:1.5px solid rgba(11,12,16,0.22);border-radius:7px;background:#FFFFFF;cursor:pointer;padding:0\" style-hover=\"border-color:#0031FF\">\n            <span style=\"{{ fill.sc1 }}\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 15 15\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8 6 11 12 4\" stroke=\"#FFFFFF\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font-size:18px;font-weight:600;letter-spacing:-0.015em\">Pick a time that suits you<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:rgba(11,12,16,0.09);border-radius:4px;overflow:hidden\">\n              <div style=\"background:#FBFBFC;padding:15px 17px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.42);margin-bottom:7px\">With<\u002Fdiv>\n                <div style=\"font-size:15px;line-height:1.45\">Liam Evans<br><span style=\"color:rgba(11,12,16,0.55)\">Co-Founder<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#FBFBFC;padding:15px 17px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.42);margin-bottom:7px\">Length<\u002Fdiv>\n                <div style=\"font-size:15px;line-height:1.45\">30 minutes<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#FBFBFC;padding:15px 17px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.42);margin-bottom:7px\">You'll leave with<\u002Fdiv>\n                <div style=\"font-size:15px;line-height:1.45\">A funnel plan, quick wins, and access to our training<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\">\n              <a href=\"{{ bookingUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:15px;font-weight:500;padding:14px 26px;border-radius:3px;background:#0031FF;color:#FFFFFF;text-decoration:none\" style-hover=\"background:#0B0C10;color:#FFFFFF;text-decoration:none\">Book your call&nbsp;↗<\u002Fa>\n              <button type=\"button\" sc-camel-on-click=\"{{ toggleOpen.sc1 }}\" style=\"font-family:'Archivo',sans-serif;font-size:14px;font-weight:500;padding:13px 20px;border-radius:3px;border:1px solid rgba(11,12,16,0.16);background:#FFFFFF;color:#0B0C10;cursor:pointer\" style-hover=\"border-color:#0031FF;color:#0031FF\">Or book on this page<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ open.sc1 }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border:1px solid rgba(11,12,16,0.10);border-radius:4px;overflow:hidden;background:#FFFFFF\">\n                <div style=\"position:relative;width:100%;height:680px\">\n                  <iframe src=\"{{ bookingUrl }}\" title=\"Book your strategy call with Liam\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0\"><\u002Fiframe>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <p style=\"margin:0;font-size:13px;line-height:1.5;color:rgba(11,12,16,0.5)\">Your times will show in ET / Phoenix. Once you're booked, tick this off and George will confirm in Slack. If the embedded calendar doesn't load for you, use the blue button — some browsers block embedded booking widgets.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section>\n      <div style=\"display:flex;gap:22px;align-items:flex-start;margin-bottom:34px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:#0031FF;padding-top:9px;flex:none;letter-spacing:0.06em\">03<\u002Fdiv>\n        <div>\n          <h2 style=\"margin:0;font-size:34px;font-weight:700;letter-spacing:-0.03em;line-height:1.1\">Your UO Systems account<\u002Fh2>\n          <p style=\"margin:16px 0 0;font-size:17px;line-height:1.6;color:rgba(11,12,16,0.62);max-width:58ch\">You've been invited into UO Systems. This is where your funnel, calendar and pipeline all live, and it's the account you'll run the business from once we hand over. Three things to set up, plus your business profile.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#FFFFFF;border:1px solid rgba(11,12,16,0.09);border-radius:4px;padding:4px 30px 26px\">\n\n        <div style=\"display:flex;gap:18px;align-items:flex-start;padding:26px 0 26px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggle.a1 }}\" aria-pressed=\"{{ pressed.a1 }}\" aria-label=\"{{ boxLabel.a1 }}\" style=\"flex:none;position:relative;width:28px;height:28px;margin-top:2px;border:1.5px solid rgba(11,12,16,0.22);border-radius:7px;background:#FFFFFF;cursor:pointer;padding:0\" style-hover=\"border-color:#0031FF\">\n            <span style=\"{{ fill.a1 }}\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 15 15\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8 6 11 12 4\" stroke=\"#FFFFFF\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font-size:18px;font-weight:600;letter-spacing:-0.015em\">Log in for the first time<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6);max-width:56ch\">Your invite is in your inbox. This walkthrough covers finding it and setting your password.<\u002Fp>\n            <div style=\"border:1px solid rgba(11,12,16,0.10);border-radius:4px;overflow:hidden;background:#FBFBFC\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;flex-wrap:wrap\">\n                <div style=\"display:flex;align-items:center;gap:11px;min-width:0\">\n                  <span style=\"flex:none;width:26px;height:26px;border-radius:99px;background:#0031FF;display:flex;align-items:center;justify-content:center\">\n                    <svg width=\"9\" height=\"10\" sc-camel-view-box=\"0 0 9 10\" aria-hidden=\"true\"><path d=\"M0 0 9 5 0 10Z\" fill=\"#FFFFFF\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(11,12,16,0.62);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">/lesson/login<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:8px;flex:none\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ toggleOpen.a1 }}\" style=\"font-family:'Archivo',sans-serif;font-size:13px;font-weight:500;padding:8px 15px;border-radius:3px;border:0;background:#0B0C10;color:#FFFFFF;cursor:pointer\" style-hover=\"background:#0031FF\">Watch here<\u002Fbutton>\n                  <a href=\"https://onboard.unorthodoxsystems.com/lesson/login\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px;font-weight:500;padding:8px 15px;border-radius:3px;border:1px solid rgba(11,12,16,0.16);color:#0B0C10;text-decoration:none\" style-hover=\"border-color:#0031FF;color:#0031FF;text-decoration:none\">Open&nbsp;↗<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ open.a1 }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:relative;width:100%;aspect-ratio:16/9;background:#0B0C10;border-top:1px solid rgba(11,12,16,0.10)\">\n                  <iframe src=\"https://onboard.unorthodoxsystems.com/lesson/login\" title=\"How to log in\" allow=\"fullscreen\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0\"><\u002Fiframe>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:18px;align-items:flex-start;padding:26px 0;border-top:1px solid rgba(11,12,16,0.09)\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggle.a2 }}\" aria-pressed=\"{{ pressed.a2 }}\" aria-label=\"{{ boxLabel.a2 }}\" style=\"flex:none;position:relative;width:28px;height:28px;margin-top:2px;border:1.5px solid rgba(11,12,16,0.22);border-radius:7px;background:#FFFFFF;cursor:pointer;padding:0\" style-hover=\"border-color:#0031FF\">\n            <span style=\"{{ fill.a2 }}\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 15 15\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8 6 11 12 4\" stroke=\"#FFFFFF\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font-size:18px;font-weight:600;letter-spacing:-0.015em\">Calendar setup, part 1<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6);max-width:56ch\">Setting up your calendars so you can take sales calls. Part 1 covers availability and connecting your calendar.<\u002Fp>\n            <div style=\"border:1px solid rgba(11,12,16,0.10);border-radius:4px;overflow:hidden;background:#FBFBFC\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;flex-wrap:wrap\">\n                <div style=\"display:flex;align-items:center;gap:11px;min-width:0\">\n                  <span style=\"flex:none;width:26px;height:26px;border-radius:99px;background:#0031FF;display:flex;align-items:center;justify-content:center\">\n                    <svg width=\"9\" height=\"10\" sc-camel-view-box=\"0 0 9 10\" aria-hidden=\"true\"><path d=\"M0 0 9 5 0 10Z\" fill=\"#FFFFFF\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(11,12,16,0.62);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">/lesson/calendars<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:8px;flex:none\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ toggleOpen.a2 }}\" style=\"font-family:'Archivo',sans-serif;font-size:13px;font-weight:500;padding:8px 15px;border-radius:3px;border:0;background:#0B0C10;color:#FFFFFF;cursor:pointer\" style-hover=\"background:#0031FF\">Watch here<\u002Fbutton>\n                  <a href=\"https://onboard.unorthodoxsystems.com/lesson/calendars\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px;font-weight:500;padding:8px 15px;border-radius:3px;border:1px solid rgba(11,12,16,0.16);color:#0B0C10;text-decoration:none\" style-hover=\"border-color:#0031FF;color:#0031FF;text-decoration:none\">Open&nbsp;↗<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ open.a2 }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:relative;width:100%;aspect-ratio:16/9;background:#0B0C10;border-top:1px solid rgba(11,12,16,0.10)\">\n                  <iframe src=\"https://onboard.unorthodoxsystems.com/lesson/calendars\" title=\"Calendar setup part 1\" allow=\"fullscreen\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0\"><\u002Fiframe>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:18px;align-items:flex-start;padding:26px 0;border-top:1px solid rgba(11,12,16,0.09)\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggle.a3 }}\" aria-pressed=\"{{ pressed.a3 }}\" aria-label=\"{{ boxLabel.a3 }}\" style=\"flex:none;position:relative;width:28px;height:28px;margin-top:2px;border:1.5px solid rgba(11,12,16,0.22);border-radius:7px;background:#FFFFFF;cursor:pointer;padding:0\" style-hover=\"border-color:#0031FF\">\n            <span style=\"{{ fill.a3 }}\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 15 15\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8 6 11 12 4\" stroke=\"#FFFFFF\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font-size:18px;font-weight:600;letter-spacing:-0.015em\">Calendar setup, part 2<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6);max-width:56ch\">Part 2 covers notifications, buffers and the booking form.<\u002Fp>\n            <div style=\"border:1px solid rgba(11,12,16,0.10);border-radius:4px;overflow:hidden;background:#FBFBFC\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;flex-wrap:wrap\">\n                <div style=\"display:flex;align-items:center;gap:11px;min-width:0\">\n                  <span style=\"flex:none;width:26px;height:26px;border-radius:99px;background:#0031FF;display:flex;align-items:center;justify-content:center\">\n                    <svg width=\"9\" height=\"10\" sc-camel-view-box=\"0 0 9 10\" aria-hidden=\"true\"><path d=\"M0 0 9 5 0 10Z\" fill=\"#FFFFFF\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(11,12,16,0.62);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">/lesson/calendars-2<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:8px;flex:none\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ toggleOpen.a3 }}\" style=\"font-family:'Archivo',sans-serif;font-size:13px;font-weight:500;padding:8px 15px;border-radius:3px;border:0;background:#0B0C10;color:#FFFFFF;cursor:pointer\" style-hover=\"background:#0031FF\">Watch here<\u002Fbutton>\n                  <a href=\"https://onboard.unorthodoxsystems.com/lesson/calendars-2\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px;font-weight:500;padding:8px 15px;border-radius:3px;border:1px solid rgba(11,12,16,0.16);color:#0B0C10;text-decoration:none\" style-hover=\"border-color:#0031FF;color:#0031FF;text-decoration:none\">Open&nbsp;↗<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ open.a3 }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:relative;width:100%;aspect-ratio:16/9;background:#0B0C10;border-top:1px solid rgba(11,12,16,0.10)\">\n                  <iframe src=\"https://onboard.unorthodoxsystems.com/lesson/calendars-2\" title=\"Calendar setup part 2\" allow=\"fullscreen\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0\"><\u002Fiframe>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n\n        <div style=\"display:flex;gap:18px;align-items:flex-start;padding:26px 0 8px;border-top:1px solid rgba(11,12,16,0.09)\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggle.bp1 }}\" aria-pressed=\"{{ pressed.bp1 }}\" aria-label=\"{{ boxLabel.bp1 }}\" style=\"flex:none;position:relative;width:28px;height:28px;margin-top:2px;border:1.5px solid rgba(11,12,16,0.22);border-radius:7px;background:#FFFFFF;cursor:pointer;padding:0\" style-hover=\"border-color:#0031FF\">\n            <span style=\"{{ fill.bp1 }}\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 15 15\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8 6 11 12 4\" stroke=\"#FFFFFF\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font-size:18px;font-weight:600;letter-spacing:-0.015em\">Complete your GHL business profile<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6);max-width:58ch\">Please complete your business profile so we can start the process of getting you a verified phone number in your account. Navigate to <strong style=\"font-weight:600\">Settings<\u002Fstrong>, select <strong style=\"font-weight:600\">Business Profile<\u002Fstrong> at the top, and complete and save each section as you go.<\u002Fp>\n            <p style=\"margin:0;font-size:13px;line-height:1.5;color:rgba(11,12,16,0.5)\">Use your registered legal business details here, not a trading name — carriers check them against public records, and a mismatch is the most common reason verification comes back declined.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section>\n      <div style=\"display:flex;gap:22px;align-items:flex-start;margin-bottom:34px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:#0031FF;padding-top:9px;flex:none;letter-spacing:0.06em\">04<\u002Fdiv>\n        <div>\n          <h2 style=\"margin:0;font-size:34px;font-weight:700;letter-spacing:-0.03em;line-height:1.1\">Brand assets<\u002Fh2>\n          <p style=\"margin:16px 0 0;font-size:17px;line-height:1.6;color:rgba(11,12,16,0.62);max-width:58ch\">We've set up a Drive folder for you already — it's linked below and it's yours to upload into. Everything we build pulls from what lands in there.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#FFFFFF;border:1px solid rgba(11,12,16,0.09);border-radius:4px;padding:4px 30px 26px\">\n        <div style=\"display:flex;gap:18px;align-items:flex-start;padding:26px 0 8px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggle.br1 }}\" aria-pressed=\"{{ pressed.br1 }}\" aria-label=\"{{ boxLabel.br1 }}\" style=\"flex:none;position:relative;width:28px;height:28px;margin-top:2px;border:1.5px solid rgba(11,12,16,0.22);border-radius:7px;background:#FFFFFF;cursor:pointer;padding:0\" style-hover=\"border-color:#0031FF\">\n            <span style=\"{{ fill.br1 }}\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 15 15\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8 6 11 12 4\" stroke=\"#FFFFFF\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font-size:18px;font-weight:600;letter-spacing:-0.015em\">Upload everything to our shared folder<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6);max-width:58ch\">Please upload any and all brand assets to this drive folder.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:rgba(11,12,16,0.09);border-radius:4px;overflow:hidden\">\n              <div style=\"background:#FBFBFC;padding:16px 18px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:#0031FF;margin-bottom:8px\">01<\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:500;margin-bottom:5px\">Logos<\u002Fdiv>\n                <div style=\"font-size:13px;line-height:1.5;color:rgba(11,12,16,0.55)\">Vector if you have it, plus light and dark versions<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#FBFBFC;padding:16px 18px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:#0031FF;margin-bottom:8px\">02<\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:500;margin-bottom:5px\">Testimonials &amp; case studies<\u002Fdiv>\n                <div style=\"font-size:13px;line-height:1.5;color:rgba(11,12,16,0.55)\">Screenshots, written quotes, video clips — anything with a real name on it<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#FBFBFC;padding:16px 18px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:#0031FF;margin-bottom:8px\">03<\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:500;margin-bottom:5px\">Media assets<\u002Fdiv>\n                <div style=\"font-size:13px;line-height:1.5;color:rgba(11,12,16,0.55)\">Photos of you and the team, site visits, b-roll, existing footage<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <a href=\"{{ driveFolderUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;font-size:14px;font-weight:500;padding:12px 20px;border-radius:3px;background:#0B0C10;color:#FFFFFF;text-decoration:none\" style-hover=\"background:#0031FF;text-decoration:none\">Open your upload folder&nbsp;↗<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:2px solid #0B0C10;padding-top:26px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.5)\">Page 2 of 3<\u002Fdiv>\n      <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\">\n        <button type=\"button\" sc-camel-on-click=\"{{ goPage.p1 }}\" style=\"font-family:'Archivo',sans-serif;font-size:14px;font-weight:500;padding:14px 20px;border-radius:3px;border:1px solid rgba(11,12,16,0.16);background:#FFFFFF;color:#0B0C10;cursor:pointer\" style-hover=\"border-color:#0031FF;color:#0031FF\">←&nbsp; Back<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ goPage.p3 }}\" style=\"font-family:'Archivo',sans-serif;font-size:15px;font-weight:500;padding:15px 26px;border-radius:3px;border:0;background:#0031FF;color:#FFFFFF;cursor:pointer\" style-hover=\"background:#0B0C10\">Next: ad account and tracking &nbsp;→<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ page3 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:76px\">\n    <section>\n      <div style=\"display:flex;gap:22px;align-items:flex-start;margin-bottom:34px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:#0031FF;padding-top:9px;flex:none;letter-spacing:0.06em\">01<\u002Fdiv>\n        <div>\n          <h2 style=\"margin:0;font-size:34px;font-weight:700;letter-spacing:-0.03em;line-height:1.1\">Ad account and tracking<\u002Fh2>\n          <sc-if value=\"{{ adSetup }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:16px 0 0;font-size:17px;line-height:1.6;color:rgba(11,12,16,0.62);max-width:58ch\">We build and launch your campaigns from your own ad account, so we need access to it and tracking wired up before any spend goes live. Three things from you.<\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ systemsOnly }}\" hint-placeholder-val=\"{{ true }}\">\n            <p style=\"margin:16px 0 0;font-size:17px;line-height:1.6;color:rgba(11,12,16,0.62);max-width:58ch\">You run the ads; we make sure everything they produce is measurable. Tracking has to be wired up before any spend goes live, otherwise we are both guessing at what converted. Three things from you.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#FFFFFF;border:1px solid rgba(11,12,16,0.09);border-radius:4px;padding:4px 30px 26px\">\n\n        <div style=\"display:flex;gap:18px;align-items:flex-start;padding:26px 0\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggle.p1 }}\" aria-pressed=\"{{ pressed.p1 }}\" aria-label=\"{{ boxLabel.p1 }}\" style=\"flex:none;position:relative;width:28px;height:28px;margin-top:2px;border:1.5px solid rgba(11,12,16,0.22);border-radius:7px;background:#FFFFFF;cursor:pointer;padding:0\" style-hover=\"border-color:#0031FF\">\n            <span style=\"{{ fill.p1 }}\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 15 15\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8 6 11 12 4\" stroke=\"#FFFFFF\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font-size:18px;font-weight:600;letter-spacing:-0.015em\">Assign us your Meta assets<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6);max-width:58ch\">In order for us to set up the tracking properly, we're going to need to have the assets <a href=\"{{ metaAssetsUrl }}\" target=\"_blank\" rel=\"noopener\">HERE<\u002Fa> assigned for us.<\u002Fp>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6);max-width:58ch\">For the base pixel code, we will send a message if we need any minor assistance.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:18px;align-items:flex-start;padding:26px 0;border-top:1px solid rgba(11,12,16,0.09)\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggle.p2 }}\" aria-pressed=\"{{ pressed.p2 }}\" aria-label=\"{{ boxLabel.p2 }}\" style=\"flex:none;position:relative;width:28px;height:28px;margin-top:2px;border:1.5px solid rgba(11,12,16,0.22);border-radius:7px;background:#FFFFFF;cursor:pointer;padding:0\" style-hover=\"border-color:#0031FF\">\n            <span style=\"{{ fill.p2 }}\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 15 15\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8 6 11 12 4\" stroke=\"#FFFFFF\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font-size:18px;font-weight:600;letter-spacing:-0.015em\">Send us your CAPI token<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6);max-width:58ch\">For the CAPI set up, we have a quick recording for you on where you can find the token that you'll send to us. Please make sure the CAPI token is copied properly — they're long, and a truncated token breaks tracking silently.<\u002Fp>\n            <div style=\"border:1px solid rgba(11,12,16,0.10);border-radius:4px;overflow:hidden;background:#FBFBFC\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;flex-wrap:wrap\">\n                <div style=\"display:flex;align-items:center;gap:11px;min-width:0\">\n                  <span style=\"flex:none;width:26px;height:26px;border-radius:99px;background:#0031FF;display:flex;align-items:center;justify-content:center\">\n                    <svg width=\"9\" height=\"10\" sc-camel-view-box=\"0 0 9 10\" aria-hidden=\"true\"><path d=\"M0 0 9 5 0 10Z\" fill=\"#FFFFFF\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fspan>\n                  <span style=\"font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">How to find the CAPI token<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:8px;flex:none\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ toggleOpen.p2 }}\" style=\"font-family:'Archivo',sans-serif;font-size:13px;font-weight:500;padding:8px 15px;border-radius:3px;border:0;background:#0B0C10;color:#FFFFFF;cursor:pointer\" style-hover=\"background:#0031FF\">Watch here<\u002Fbutton>\n                  <a href=\"{{ capiVideoUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px;font-weight:500;padding:8px 15px;border-radius:3px;border:1px solid rgba(11,12,16,0.16);color:#0B0C10;text-decoration:none\" style-hover=\"border-color:#0031FF;color:#0031FF;text-decoration:none\">Open&nbsp;↗<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ open.p2 }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:relative;width:100%;aspect-ratio:16/9;background:#0B0C10;border-top:1px solid rgba(11,12,16,0.10)\">\n                  <iframe src=\"{{ capiEmbedUrl }}\" title=\"How to find the CAPI token\" allow=\"fullscreen\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0\"><\u002Fiframe>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:9px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.42)\">Paste your CAPI token<\u002Fspan>\n              <textarea rows=\"3\" value=\"{{ fields.capi }}\" sc-camel-on-change=\"{{ onField.capi }}\" placeholder=\"EAA…\" style=\"width:100%;font-size:13px;line-height:1.6;padding:13px 15px;border:1px solid rgba(11,12,16,0.16);border-radius:3px;background:#FBFBFC;color:#0B0C10;resize:vertical\" style-focus=\"outline:none;border-color:#0031FF;background:#FFFFFF\"><\u002Ftextarea>\n              <span style=\"font-size:13px;line-height:1.5;color:rgba(11,12,16,0.5)\">A correctly copied token runs to roughly 200 characters, with no spaces or line breaks. Drop it in Slack as well so we're notified.<\u002Fspan>\n            <\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n\n        <div style=\"display:flex;gap:18px;align-items:flex-start;padding:26px 0 8px;border-top:1px solid rgba(11,12,16,0.09)\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggle.p3 }}\" aria-pressed=\"{{ pressed.p3 }}\" aria-label=\"{{ boxLabel.p3 }}\" style=\"flex:none;position:relative;width:28px;height:28px;margin-top:2px;border:1.5px solid rgba(11,12,16,0.22);border-radius:7px;background:#FFFFFF;cursor:pointer;padding:0\" style-hover=\"border-color:#0031FF\">\n            <span style=\"{{ fill.p3 }}\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 15 15\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8 6 11 12 4\" stroke=\"#FFFFFF\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font-size:18px;font-weight:600;letter-spacing:-0.015em\">Tell us your Business Manager name<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6);max-width:58ch\">So we request access against the right account rather than guessing. It's the name at the top of Meta Business Settings — if you have more than one, give us the one that holds the ad account you'll be spending from.<\u002Fp>\n            <label style=\"display:flex;flex-direction:column;gap:9px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.42)\">Meta Business Manager name<\u002Fspan>\n              <input type=\"text\" value=\"{{ fields.metabm }}\" sc-camel-on-change=\"{{ onField.metabm }}\" placeholder=\"e.g. Acme Group Ltd\" style=\"width:100%;font-size:14px;padding:13px 15px;border:1px solid rgba(11,12,16,0.16);border-radius:3px;background:#FBFBFC;color:#0B0C10\" style-focus=\"outline:none;border-color:#0031FF;background:#FFFFFF\">\n            <\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ allDone }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"background:#0031FF;color:#FFFFFF;border-radius:4px;padding:44px 40px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.66);margin-bottom:16px\">Everything complete<\u002Fdiv>\n        <h2 style=\"margin:0;font-size:32px;font-weight:700;letter-spacing:-0.03em;line-height:1.15;max-width:26ch\">That's everything. Post in Slack and we'll take it from here.<\u002Fh2>\n        <p style=\"margin:18px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.78);max-width:52ch\">Let George know in Slack and we'll confirm everything on our side. We know speed matters, so always know we're on it.<\u002Fp>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:2px solid #0B0C10;padding-top:26px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.5)\">Page 3 of 3<\u002Fdiv>\n      <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\">\n        <button type=\"button\" sc-camel-on-click=\"{{ goPage.p2 }}\" style=\"font-family:'Archivo',sans-serif;font-size:14px;font-weight:500;padding:14px 20px;border-radius:3px;border:1px solid rgba(11,12,16,0.16);background:#FFFFFF;color:#0B0C10;cursor:pointer\" style-hover=\"border-color:#0031FF;color:#0031FF\">←&nbsp; Back<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <footer style=\"background:#0B0C10;color:#FFFFFF;margin-top:50px;padding:64px 0 56px\">\n    <div style=\"width:100%;max-width:940px;margin:0 auto;padding:0 32px\">\n      <div style=\"display:flex;gap:48px;justify-content:space-between;flex-wrap:wrap\">\n        <div style=\"max-width:46ch\">\n          <h3 style=\"margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em\">Stuck on any of this?<\u002Fh3>\n          <p style=\"margin:14px 0 0;font-size:15px;line-height:1.65;color:rgba(255,255,255,0.6)\">Message us in the Slack channel with any questions, large or small, and let us know there as you complete each step. If you're yet to join Slack and can't see the invite in your inbox, please search 'Slack' — and if you're still not able to join, drop us a note at <a href=\"mailto:hello@unorthodox.digital\" style=\"color:#FFFFFF;text-decoration:underline\">hello@unorthodox.digital<\u002Fa> and we'll get it sorted with you.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(255,255,255,0.4)\">Your main point of contact<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:rgba(255,255,255,0.82)\">George Lloyd<br>Head of Client Success<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:64px;padding-top:28px;border-top:1px solid rgba(255,255,255,0.13)\">\n        <img src=\"20fd4984-c7ca-409a-939f-8779411be5e5\" alt=\"Unorthodox\" style=\"height:15px;width:auto;display:block;opacity:0.8\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.34)\">Prepared for Zestful Media &amp; Design<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;adSetup&quot;: {\n    &quot;editor&quot;: &quot;boolean&quot;,\n    &quot;default&quot;: true,\n    &quot;tsType&quot;: &quot;boolean&quot;,\n    &quot;section&quot;: &quot;Client path&quot;,\n    &quot;label&quot;: &quot;Contract is Systems + Ad Setup (Mgmt)&quot;\n  },\n  &quot;storageKey&quot;: {\n    &quot;editor&quot;: &quot;text&quot;,\n    &quot;default&quot;: &quot;zestful-media-design&quot;,\n    &quot;tsType&quot;: &quot;string&quot;,\n    &quot;section&quot;: &quot;Client path&quot;,\n    &quot;label&quot;: &quot;Progress storage key (one per client)&quot;\n  },\n  &quot;bookingUrl&quot;: {\n    &quot;editor&quot;: &quot;text&quot;,\n    &quot;default&quot;: &quot;https://api.leadconnectorhq.com/widget/booking/CujAo6SVxELHA1D78qaB&quot;,\n    &quot;tsType&quot;: &quot;string&quot;,\n    &quot;section&quot;: &quot;Links&quot;,\n    &quot;label&quot;: &quot;Strategy call booking link&quot;\n  },\n  &quot;metaAssetsUrl&quot;: {\n    &quot;editor&quot;: &quot;text&quot;,\n    &quot;default&quot;: &quot;https://docs.google.com/document/d/12-qBqZTSSND6NtO-guQBG4BhOU0jivsdB9hyXvaxH1I/edit?tab=t.0#heading=h.cpiuikq0zye0&quot;,\n    &quot;tsType&quot;: &quot;string&quot;,\n    &quot;section&quot;: &quot;Links&quot;,\n    &quot;label&quot;: &quot;Pixel setup guide&quot;\n  },\n  &quot;capiVideoUrl&quot;: {\n    &quot;editor&quot;: &quot;text&quot;,\n    &quot;default&quot;: &quot;https://www.loom.com/share/ba47fd333d9c440aa3a5286171ce664e&quot;,\n    &quot;tsType&quot;: &quot;string&quot;,\n    &quot;section&quot;: &quot;Links&quot;,\n    &quot;label&quot;: &quot;CAPI token walkthrough (Loom)&quot;\n  },\n  &quot;driveFolderUrl&quot;: {\n    &quot;editor&quot;: &quot;text&quot;,\n    &quot;default&quot;: &quot;https://drive.google.com/drive/folders/1Z7C2dt-85j-VgfOnW2gpBG2UVMfT4hzE&quot;,\n    &quot;tsType&quot;: &quot;string&quot;,\n    &quot;section&quot;: &quot;Links&quot;,\n    &quot;label&quot;: &quot;Brand assets upload folder&quot;\n  }\n}\">\nclass Component extends DCLogic {\n  state = { done: {}, open: {}, fields: {}, page: 1, agreed: false, sigDraft: '' };\n\n  storeKey() { return 'uo-onboarding-' + (this.props.storageKey || 'default'); }\n\n  // Progress is shared, not per-browser. The slug comes from the URL, which is\n  // unique by construction; storageKey is only a fallback for the design editor.\n  stateUrl() {\n    const parts = location.pathname.split('/').filter(Boolean);\n    return '/api/state/' + (parts[parts.length - 1] || this.props.storageKey || 'default');\n  }\n\n  componentDidMount() {\n    // Render from the local cache first so the page never flashes empty.\n    let s = {};\n    try { s = JSON.parse(localStorage.getItem(this.storeKey()) || '{}'); } catch (e) {}\n    this.setState({ done: s.done || {}, fields: s.fields || {} });\n    this.syncDown(s);\n    this.syncTimer = setInterval(() => this.syncDown(), 15000);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.syncTimer);\n    clearTimeout(this.pushTimer);\n  }\n\n  syncDown(local) {\n    fetch(this.stateUrl(), { cache: 'no-store' })\n      .then(r => (r.ok ? r.json() : null))\n      .then(s => {\n        // Never overwrite what the user is in the middle of saving.\n        if (!s || this.pending) return;\n        const remoteEmpty = !Object.keys(s.done || {}).length && !Object.keys(s.fields || {}).length;\n        const localHas = local && (Object.keys(local.done || {}).length || Object.keys(local.fields || {}).length);\n        // First load after the switch: adopt whatever this browser had already,\n        // so a client who ticked boxes before does not see them disappear.\n        if (remoteEmpty && localHas) { this.persist(local.done || {}, local.fields || {}); return; }\n        this.setState({ done: s.done || {}, fields: s.fields || {} });\n      })\n      .catch(() => {});\n  }\n\n  persist(done, fields) {\n    try { localStorage.setItem(this.storeKey(), JSON.stringify({ done: done, fields: fields })); } catch (e) {}\n    // Debounced, so typing in a field is one write rather than one per keystroke.\n    this.pending = true;\n    clearTimeout(this.pushTimer);\n    this.pushTimer = setTimeout(() => {\n      fetch(this.stateUrl(), { method: 'PUT', headers: { 'content-type': 'application/json' },\n        body: JSON.stringify({ done: done, fields: fields }) })\n        .catch(() => {})\n        .then(() => { this.pending = false; });\n    }, 400);\n  }\n\n  downloadPdf() {\n    const root = document.getElementById('uo-contract');\n    const lib = window.jspdf;\n    if (!root || !lib) { window.print(); return; }\n    const doc = new lib.jsPDF({ unit: 'pt', format: 'a4' });\n    const PW = doc.internal.pageSize.getWidth(), PH = doc.internal.pageSize.getHeight();\n    const M = 54, W = PW - M * 2;\n    let y = M;\n    const need = (n) => { if (y + n > PH - M) { doc.addPage(); y = M; } };\n    const write = (str, size, style, gapAfter, grey, indent) => {\n      if (!str) return;\n      doc.setFont('helvetica', style || 'normal');\n      doc.setFontSize(size);\n      doc.setTextColor(grey ? 110 : 22, grey ? 110 : 22, grey ? 116 : 28);\n      const x = M + (indent || 0);\n      const lines = doc.splitTextToSize(String(str), W - (indent || 0));\n      const lh = size * 1.42;\n      for (let i = 0; i < lines.length; i++) { need(lh); doc.text(lines[i], x, y); y += lh; }\n      y += gapAfter || 0;\n    };\n    const rule = () => { need(14); doc.setDrawColor(214, 216, 220); doc.line(M, y, PW - M, y); y += 14; };\n\n    const titleEl = document.getElementById('uo-contract-title');\n    write(titleEl ? titleEl.textContent.trim() : 'Client Service Agreement', 17, 'bold', 4);\n    write('Unorthodox Digital Ltd', 9, 'normal', 10, true);\n    rule();\n\n    let startDate = '';\n    const grid = document.getElementById('uo-contract-details');\n    if (grid) {\n      const cells = grid.children;\n      for (let i = 0; i < cells.length; i++) {\n        const kids = cells[i].children;\n        if (kids.length < 2) continue;\n        const label = kids[0].textContent.trim();\n        if (/start date/i.test(label)) startDate = kids[1].textContent.trim();\n        write(label.toUpperCase(), 7.5, 'bold', 1, true);\n        write(kids[1].innerText ? kids[1].innerText.replace(/\\n+/g, ', ').trim() : kids[1].textContent.trim(), 10.5, 'normal', 9);\n      }\n      rule();\n    }\n\n    const box = root.querySelector('.clamp');\n    if (box) {\n      const nodes = box.querySelectorAll('h3, h4, p, li');\n      for (let i = 0; i < nodes.length; i++) {\n        const el = nodes[i];\n        const t = el.textContent.replace(/\\s+/g, ' ').trim();\n        if (!t) continue;\n        const tag = el.tagName.toLowerCase();\n        if (tag === 'h3') { y += 8; need(30); write(t, 11.5, 'bold', 3); doc.setDrawColor(214, 216, 220); doc.line(M, y - 1, PW - M, y - 1); y += 8; }\n        else if (tag === 'h4') { y += 4; write(t, 10.5, 'bold', 3); }\n        else if (tag === 'li') { need(15); doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(22, 22, 28); doc.text('\\u2022', M + 6, y); write(t, 10, 'normal', 3, false, 20); }\n        else write(t, 10, 'normal', 7);\n      }\n    }\n\n    const f = this.state.fields || {};\n    y += 10; rule();\n    write('SIGNATURES', 11.5, 'bold', 10);\n    write('CLIENT', 7.5, 'bold', 3, true);\n    if (f.sig_at) {\n      const d = new Date(f.sig_at);\n      write(f.sig_name || '', 15, 'bolditalic', 2);\n      write('Name: ' + (f.sig_name || ''), 10, 'normal', 2);\n      write('Date: ' + d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) + ' at ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }), 10, 'normal', 4);\n      write('Accepted electronically at ' + location.href, 8, 'normal', 14, true);\n    } else {\n      write('Name: \\u2014', 10, 'normal', 2);\n      write('Date: \\u2014', 10, 'normal', 4);\n      write('Not yet signed.', 8, 'normal', 14, true);\n    }\n    write('UNORTHODOX DIGITAL LTD', 7.5, 'bold', 3, true);\n    write('Unorthodox Digital Ltd', 15, 'bolditalic', 2);\n    write('Name: Unorthodox Digital Ltd', 10, 'normal', 2);\n    write('Date: ' + (startDate || '\\u2014'), 10, 'normal', 0);\n\n    const total = doc.internal.getNumberOfPages();\n    for (let p = 1; p <= total; p++) {\n      doc.setPage(p);\n      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(140, 140, 146);\n      doc.text('Unorthodox Digital Ltd', M, PH - 26);\n      doc.text(p + ' / ' + total, PW - M, PH - 26, { align: 'right' });\n    }\n    const who = (root.getAttribute('data-client') || 'Client').replace(/[^A-Za-z0-9 &-]/g, '').trim();\n    doc.save('Unorthodox Agreement - ' + who + '.pdf');\n  }\n\n  activeIds() {\n    return ['contract', 'sc1', 'a1', 'a2', 'a3', 'bp1', 'p1', 'p2', 'p3', 'br1'];\n  }\n\n  renderVals() {\n    const ids = ['contract', 'sc1', 'a1', 'a2', 'a3', 'bp1', 'p1', 'p2', 'p3', 'br1'];\n    const fieldIds = ['capi', 'metabm'];\n    const done = this.state.done, open = this.state.open, fields = this.state.fields;\n\n    const labels = {\n      contract: 'Your agreement',\n      sc1: 'Pick a time that suits you',\n      a1: 'Log in for the first time',\n      a2: 'Calendar setup, part 1',\n      a3: 'Calendar setup, part 2',\n      p1: 'Assign us your Meta assets',\n      p2: 'Send us your CAPI token',\n      p3: 'Tell us your Business Manager name',\n      br1: 'Upload everything to our shared folder',\n      bp1: 'Complete your GHL business profile'\n    };\n    const toggle = {}, toggleOpen = {}, fill = {}, onField = {}, fieldVals = {}, pressed = {}, boxLabel = {};\n\n    ids.forEach((id) => {\n      toggle[id] = () => this.setState((prev) => {\n        const next = Object.assign({}, prev.done);\n        if (next[id]) delete next[id]; else next[id] = true;\n        this.persist(next, prev.fields);\n        return { done: next };\n      });\n      toggleOpen[id] = () => this.setState((prev) => {\n        const next = Object.assign({}, prev.open);\n        next[id] = !next[id];\n        return { open: next };\n      });\n      const on = !!done[id];\n      pressed[id] = on;\n      boxLabel[id] = (on ? 'Mark as not done: ' : 'Mark as done: ') + labels[id];\n      fill[id] = {\n        position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',\n        background: '#0031FF', borderRadius: '5px', pointerEvents: 'none',\n        transition: 'opacity .16s ease, transform .16s ease',\n        opacity: on ? 1 : 0, transform: on ? 'scale(1)' : 'scale(0.7)'\n      };\n    });\n\n    fieldIds.forEach((f) => {\n      fieldVals[f] = fields[f] || '';\n      onField[f] = (e) => {\n        const v = e.target.value;\n        this.setState((prev) => {\n          const next = Object.assign({}, prev.fields);\n          next[f] = v;\n          this.persist(prev.done, next);\n          return { fields: next };\n        });\n      };\n    });\n\n    const page = this.state.page;\n    const goPage = {};\n    [1, 2, 3].forEach((n) => {\n      goPage['p' + n] = () => { this.setState({ page: n }); window.scrollTo(0, 0); };\n    });\n    const tab = {};\n    [1, 2, 3].forEach((n) => {\n      const on = page === n;\n      tab['t' + n] = {\n        fontFamily: \"'JetBrains Mono', monospace\", fontSize: '12px', fontWeight: 500,\n        width: '30px', height: '30px', borderRadius: '3px', cursor: 'pointer', padding: 0,\n        border: on ? '1px solid #0031FF' : '1px solid rgba(11,12,16,0.16)',\n        background: on ? '#0031FF' : '#FFFFFF',\n        color: on ? '#FFFFFF' : 'rgba(11,12,16,0.55)'\n      };\n    });\n\n    const sigName = fields.sig_name || '';\n    const sigAt = fields.sig_at || '';\n    const canSign = !!(this.state.sigDraft || '').trim() && this.state.agreed;\n    let sigWhen = '';\n    if (sigAt) {\n      const d = new Date(sigAt);\n      sigWhen = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) +\n        ' at ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });\n    }\n\n    const active = this.activeIds();\n    const count = active.filter((id) => done[id]).length;\n    const pct = active.length ? Math.round((count / active.length) * 100) : 0;\n\n    return {\n      done: done,\n      pressed: pressed,\n      boxLabel: boxLabel,\n      open: open,\n      toggle: toggle,\n      toggleOpen: toggleOpen,\n      fill: fill,\n      fields: fieldVals,\n      onField: onField,\n      allDone: count === active.length,\n      progressLabel: count + ' of ' + active.length,\n      barStyle: {\n        height: '100%', width: pct + '%', background: '#0031FF',\n        borderRadius: '99px', transition: 'width .35s cubic-bezier(.2,.7,.2,1)'\n      },\n      bookingUrl: this.props.bookingUrl || 'https://api.leadconnectorhq.com/widget/booking/CujAo6SVxELHA1D78qaB',\n      metaAssetsUrl: this.props.metaAssetsUrl || 'https://docs.google.com/document/d/12-qBqZTSSND6NtO-guQBG4BhOU0jivsdB9hyXvaxH1I/edit?tab=t.0#heading=h.cpiuikq0zye0',\n      capiVideoUrl: this.props.capiVideoUrl || 'https://www.loom.com/share/ba47fd333d9c440aa3a5286171ce664e',\n      capiEmbedUrl: (this.props.capiVideoUrl || 'https://www.loom.com/share/ba47fd333d9c440aa3a5286171ce664e').replace('/share/', '/embed/'),\n      driveFolderUrl: this.props.driveFolderUrl || 'https://drive.google.com/drive/folders/1Z7C2dt-85j-VgfOnW2gpBG2UVMfT4hzE',\n      adSetup: this.props.adSetup !== false,\n      systemsOnly: this.props.adSetup === false,\n      page1: page === 1,\n      page2: page === 2,\n      page3: page === 3,\n      goPage: goPage,\n      tab: tab,\n      signed: !!sigAt,\n      notSigned: !sigAt,\n      sigName: sigName,\n      sigWhen: sigWhen,\n      sigDraft: this.state.sigDraft,\n      onSigDraft: (e) => this.setState({ sigDraft: e.target.value }),\n      agreed: this.state.agreed,\n      onAgreed: (e) => this.setState({ agreed: e.target.checked }),\n      signDisabled: !canSign,\n      signBtnStyle: {\n        alignSelf: 'flex-start', fontFamily: \"'Archivo', sans-serif\", fontSize: '15px', fontWeight: 500,\n        padding: '14px 26px', borderRadius: '3px', border: 0,\n        background: canSign ? '#0031FF' : 'rgba(11,12,16,0.14)',\n        color: canSign ? '#FFFFFF' : 'rgba(11,12,16,0.45)',\n        cursor: canSign ? 'pointer' : 'not-allowed'\n      },\n      downloadPdf: () => this.downloadPdf(),\n      sign: () => {\n        const name = (this.state.sigDraft || '').trim();\n        if (!name || !this.state.agreed) return;\n        this.setState((prev) => {\n          const nf = Object.assign({}, prev.fields);\n          nf.sig_name = name;\n          nf.sig_at = new Date().toISOString();\n          const nd = Object.assign({}, prev.done);\n          nd.contract = true;\n          this.persist(nd, nf);\n          return { fields: nf, done: nd };\n        });\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
