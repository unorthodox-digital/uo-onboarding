document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

*{visibility:hidden}\n    #uo-contract, #uo-contract *{visibility:visible}\n    #uo-contract{position:absolute;left:0;top:0;width:100%;border:0;padding:0}\n    #uo-contract .noprint{display:none}\n    #uo-contract .clamp{max-height:none !important;overflow:visible !important;border:0 !important;padding:0 !important}\n  }\n<\u002Fstyle>\n<script src=\"77950407-5987-474f-bb76-4f95e5423a9d\"><\u002Fscript>\n<script src=\"1f15dfdf-9b26-47ef-b3d4-6e0f0fa3b305\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#F4F5F7\">\n  <header style=\"background:#0B0C10;color:#FFFFFF;padding:34px 0 30px\">\n    <div style=\"width:100%;max-width:940px;margin:0 auto;padding:0 32px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n        <img src=\"20fd4984-c7ca-409a-939f-8779411be5e5\" alt=\"Unorthodox\" style=\"height:19px;width:auto;display:block\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.44)\">Client Onboarding &nbsp;/&nbsp; UO Systems<\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ page1 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n      <div style=\"height:46px\"><\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:22px\">\n        <span style=\"width:7px;height:7px;border-radius:99px;background:#0031FF;display:block\"><\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#FFFFFF\">Zestful Media &amp; Design<\u002Fspan>\n      <\u002Fdiv>\n\n      <h1 style=\"margin:0;font-size:54px;line-height:1.03;font-weight:700;letter-spacing:-0.035em;max-width:16ch\">Welcome, Megan &amp; Ellie.<\u002Fh1>\n\n      <p style=\"margin:24px 0 0;font-size:19px;line-height:1.55;color:rgba(255,255,255,0.72);max-width:56ch\">Great to have you with us. This page is your starting point: everything we need from you before we start building, gathered in one place. It comes in three short pages, and if you can clear them within 48 hours your 7-day build window starts right on time.<\u002Fp>\n\n      <p style=\"margin:16px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.55);max-width:56ch\">Your progress saves as you go, and a quick note in Slack as you tick things off keeps us moving.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:rgba(255,255,255,0.12);margin-top:44px;border-radius:2px;overflow:hidden\">\n        <div style=\"background:#0B0C10;padding:20px 22px 22px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:10px\">Package<\u002Fdiv>\n          <sc-if value=\"{{ adSetup }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:16px;font-weight:500;line-height:1.35\">Systems + Ad Setup<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ systemsOnly }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size:16px;font-weight:500;line-height:1.35\">Systems<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"background:#0B0C10;padding:20px 22px 22px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:10px\">Your CRM<\u002Fdiv>\n          <div style=\"font-size:16px;font-weight:500;line-height:1.35\">UO Systems account created for you<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0B0C10;padding:20px 22px 22px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:10px\">Build window<\u002Fdiv>\n          <div style=\"font-size:16px;font-weight:500;line-height:1.35\">7 days from signature to live<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0B0C10;padding:20px 22px 22px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:10px\">Your deadline<\u002Fdiv>\n          <div style=\"font-size:16px;font-weight:500;line-height:1.35\">All three pages within 48 hours<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n          <div style=\"height:14px\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"position:sticky;top:0;z-index:40;background:rgba(244,245,247,0.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(11,12,16,0.09)\">\n    <div style=\"width:100%;max-width:940px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:20px\">\n      <div style=\"display:flex;gap:6px;flex:none\" role=\"tablist\" aria-label=\"Onboarding pages\">\n        <button type=\"button\" sc-camel-on-click=\"{{ goPage.p1 }}\" aria-label=\"Page 1: welcome\" style=\"{{ tab.t1 }}\">1<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ goPage.p2 }}\" aria-label=\"Page 2: what we need from you\" style=\"{{ tab.t2 }}\">2<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ goPage.p3 }}\" aria-label=\"Page 3: ad account and brand assets\" style=\"{{ tab.t3 }}\">3<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"flex:1;height:5px;border-radius:99px;background:rgba(11,12,16,0.10);overflow:hidden\">\n        <div style=\"{{ barStyle }}\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:#0031FF;white-space:nowrap;min-width:78px;text-align:right\">{{ progressLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <main style=\"width:100%;max-width:940px;margin:0 auto;padding:64px 32px 40px;display:flex;flex-direction:column;gap:0\">\n\n    <sc-if value=\"{{ page1 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:76px\">\n    <section>\n      <h2 style=\"margin:0;font-size:34px;font-weight:700;letter-spacing:-0.03em;line-height:1.1\">What we're building<\u002Fh2>\n      <p style=\"margin:16px 0 40px;font-size:17px;line-height:1.6;color:rgba(11,12,16,0.62);max-width:62ch\">By day seven you'll have one connected system rather than a set of parts: paid traffic pointing at a page that sells, a calendar that fills itself, and tracking that tells you what a booked call actually cost you. Every request on this page exists to unlock one of those three pieces.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:rgba(11,12,16,0.09);border:1px solid rgba(11,12,16,0.09);border-radius:4px;overflow:hidden\">\n        <div style=\"background:#FFFFFF;padding:26px 26px 30px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#0031FF;margin-bottom:16px\">01<\u002Fdiv>\n          <h3 style=\"margin:0 0 10px;font-size:18px;font-weight:600;letter-spacing:-0.015em\">The offer and the message<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6)\">Before a word gets written we agree who you're speaking to, what you're promising and the angle that carries it. Your VSL, pages and ads all inherit that, so it gets built and signed off first.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;padding:26px 26px 30px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#0031FF;margin-bottom:16px\">02<\u002Fdiv>\n          <h3 style=\"margin:0 0 10px;font-size:18px;font-weight:600;letter-spacing:-0.015em\">The funnel and the system<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6)\">Landing page, VSL, calendar, pipeline stages and follow-up automations, built inside your own GHL account so leads, bookings and history all sit in one place you control.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;padding:26px 26px 30px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#0031FF;margin-bottom:16px\">03<\u002Fdiv>\n          <h3 style=\"margin:0 0 10px;font-size:18px;font-weight:600;letter-spacing:-0.015em\">Traffic and tracking<\u002Fh3>\n          <sc-if value=\"{{ adSetup }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6)\">We build and launch your initial campaigns, with pixel and CAPI wired up so every lead is attributable and a live tracker you can check any time. Tracking gets tested with a live lead before launch, because if it's wrong then every number after it is wrong too. Once campaigns are live and delivering, the day-to-day running is yours.<\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ systemsOnly }}\" hint-placeholder-val=\"{{ true }}\">\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6)\">You run and manage the ads yourself. What we build is everything underneath them: pixel and CAPI wired up so every lead is attributable, plus a live tracker you can check any time. Tracking gets tested with a live lead before launch, because if it's wrong then every number after it is wrong too.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section>\n      <h2 style=\"margin:0;font-size:34px;font-weight:700;letter-spacing:-0.03em;line-height:1.1\">Your timeline<\u002Fh2>\n      <p style=\"margin:16px 0 40px;font-size:17px;line-height:1.6;color:rgba(11,12,16,0.62);max-width:62ch\">Seven days from signature to live, then three weeks of reporting and support. The dates hold as long as reviews come back on time — if we're ever waiting on you, we'll say so in Slack and move the date openly rather than quietly absorbing it.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(370px,1fr));gap:20px;align-items:start\">\n        <div style=\"background:#FFFFFF;border:1px solid rgba(11,12,16,0.09);border-radius:4px;overflow:hidden\">\n          <div style=\"padding:18px 28px;border-bottom:1px solid rgba(11,12,16,0.09);background:#FBFBFC\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.5)\">Week 1 — signature to live<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:24px;padding:22px 28px;align-items:flex-start\">\n            <div style=\"flex:none;width:88px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#0031FF;padding-top:3px\">Day 0<\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:16px;font-weight:600;margin-bottom:5px\">Slack channel opens<\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58)\">Your channel goes live with your UO team in it, access requests go out, and your strategy call gets booked.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:24px;padding:22px 28px;align-items:flex-start;border-top:1px solid rgba(11,12,16,0.09)\">\n            <div style=\"flex:none;width:88px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#0031FF;padding-top:3px\">Day 1–2<\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:16px;font-weight:600;margin-bottom:5px\">Strategy call with Liam<\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58)\">Business audit, your funnel plan, up to three quick wins you can action this week, and access to the training portal. Recorded, with a written summary in Slack afterwards.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:24px;padding:22px 28px;align-items:flex-start;border-top:1px solid rgba(11,12,16,0.09)\">\n            <div style=\"flex:none;width:88px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#0031FF;padding-top:3px\">Day 2–3<\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:16px;font-weight:600;margin-bottom:5px\">Offer blueprint<\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58)\">We send you a short set of questions and build your blueprint from them: market, mechanism, promise, proof and objections. You approve it. No copy, VSL or ad script starts before that approval, because all three depend on it.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:24px;padding:22px 28px;align-items:flex-start;border-top:1px solid rgba(11,12,16,0.09)\">\n            <div style=\"flex:none;width:88px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#0031FF;padding-top:3px\">Day 2–5<\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:16px;font-weight:600;margin-bottom:5px\">Build sprint<\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58)\">Infrastructure, copy and creative run in parallel: GHL and domain, funnel pages, VSL script, ad scripts, static creative, automations and tracking. Scripts and creative come to you in one batch for review, not piecemeal.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:24px;padding:22px 28px;align-items:flex-start;border-top:1px solid rgba(11,12,16,0.09)\">\n            <div style=\"flex:none;width:88px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#0031FF;padding-top:3px\">Day 5–6<\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:16px;font-weight:600;margin-bottom:5px\">Internal checks, then your final review<\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58)\">Five sign-offs happen internally first — funnel, tracking, copy, creative and automations — so you're never the one who finds a broken button. Then the whole package comes to you in one post, with a 24-hour turnaround.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:24px;padding:24px 28px;align-items:flex-start;border-top:1px solid rgba(11,12,16,0.09);background:rgba(0,49,255,0.035)\">\n            <div style=\"flex:none;width:88px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#0031FF;padding-top:3px\">Day 7<\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:17px;font-weight:700;letter-spacing:-0.01em;color:#0031FF;margin-bottom:5px\">Live<\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.62)\">You switch your ads on and confirm first spend, and we post in Slack setting out what to expect from the first 72 hours — including what normal looks like, so a quiet first day doesn't read as a problem.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#FFFFFF;border:1px solid rgba(11,12,16,0.09);border-radius:4px;overflow:hidden\">\n          <div style=\"padding:18px 28px;border-bottom:1px solid rgba(11,12,16,0.09);background:#FBFBFC\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.5)\">Weeks 2–4 — reporting and support<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:24px;padding:22px 28px;align-items:flex-start\">\n            <div style=\"flex:none;width:88px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#0031FF;padding-top:3px\">Day 9–10<\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:16px;font-weight:600;margin-bottom:5px\">72-hour launch check<\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58)\">A short green, amber or red note in Slack off the back of your tracker: are ads delivering, is spend pacing, are leads landing in your CRM, is the pixel reporting. Week two is too late to catch a launch error.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:24px;padding:22px 28px;align-items:flex-start;border-top:1px solid rgba(11,12,16,0.09)\">\n            <div style=\"flex:none;width:88px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#0031FF;padding-top:3px\">Week 2<\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:16px;font-weight:600;margin-bottom:5px\">First full audit<\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58)\">Budget pacing, which angles are getting delivery, and attribution integrity. You get either a green light with what we're watching, or a numbered fix list — each item with a reason, an owner and a date.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:24px;padding:22px 28px;align-items:flex-start;border-top:1px solid rgba(11,12,16,0.09)\">\n            <div style=\"flex:none;width:88px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#0031FF;padding-top:3px\">Week 3<\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:16px;font-weight:600;margin-bottom:5px\">Diagnosis<\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58)\">Enough data now exists to separate an ads problem from a funnel problem from a sales problem. We tell you which one it is, explicitly.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:24px;padding:22px 28px;align-items:flex-start;border-top:1px solid rgba(11,12,16,0.09)\">\n            <div style=\"flex:none;width:88px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#0031FF;padding-top:3px\">Week 4<\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:16px;font-weight:600;margin-bottom:5px\">Scale recommendations<\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58)\">What to scale, what to cut, and a creative refresh brief if fatigue is showing. You make the changes in your ad account; we handle anything that needs doing on the funnel. Week 4 closes our support window, and we book your review before it does.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:24px;padding:22px 28px;align-items:flex-start;border-top:1px solid rgba(11,12,16,0.09)\">\n            <div style=\"flex:none;width:88px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#0031FF;padding-top:3px\">After wk 4<\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:16px;font-weight:600;margin-bottom:5px\">Your full review<\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58)\">Where you started, what was built, what we recommended, what got actioned and what it produced. Week 4 concludes the scope of support, so the review runs once that's wrapped — written up beforehand, then walked through together.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:20px 28px;border-top:1px solid rgba(11,12,16,0.09);background:#FBFBFC\">\n            <p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58)\"><strong style=\"font-weight:600;color:#0B0C10\">The weekly rhythm.<\u002Fstrong> Numbers pulled Monday, report built Tuesday, posted to your Slack channel Wednesday. Same metrics every week so the trend is readable: spend, CPM, CTR, cost per lead, leads, booked calls, show rate, closes, cost per acquisition and ROAS — from your CRM as well as from Meta.<\u002Fp>\n            <sc-if value=\"{{ adSetup }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:14px 0 0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58)\"><strong style=\"font-weight:600;color:#0B0C10\">Who does what.<\u002Fstrong> We build, compliance-check and launch your initial campaigns, and confirm they are delivering. From there the day-to-day running of the ad account is yours — spend and optimisation — while we give you a live tracker plus a written report on what the ads and the funnel are producing, and we optimise and support the funnel itself.<\u002Fp>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ systemsOnly }}\" hint-placeholder-val=\"{{ true }}\">\n              <p style=\"margin:14px 0 0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58)\"><strong style=\"font-weight:600;color:#0B0C10\">Who does what.<\u002Fstrong> You fully manage the ad account — running it, spending and optimising. We give you a live tracker plus a written report on what the ads and the funnel are producing, and we optimise and support the funnel itself.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-top:2px solid #0B0C10;padding-top:34px\">\n      <h2 style=\"margin:0;font-size:44px;font-weight:700;letter-spacing:-0.035em;line-height:1.05\">Four things that stay yours<\u002Fh2>\n      <p style=\"margin:18px 0 40px;font-size:17px;line-height:1.6;color:rgba(11,12,16,0.62);max-width:60ch\">We build the system and show you how to run it. These four decide whether it turns into revenue, and none of them are things we can do on your behalf.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1px;background:rgba(11,12,16,0.09);border:1px solid rgba(11,12,16,0.09);border-radius:4px;overflow:hidden\">\n        <div style=\"background:#FFFFFF;padding:26px 26px 30px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#0031FF;margin-bottom:16px\">01<\u002Fdiv>\n          <h3 style=\"margin:0 0 10px;font-size:18px;font-weight:600;letter-spacing:-0.015em\">Hold the ad budget<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6)\">Stick to the agreed daily spend for the whole test window. Cutting or pausing mid-test resets learning and hands us data we can't act on.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;padding:26px 26px 30px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#0031FF;margin-bottom:16px\">02<\u002Fdiv>\n          <h3 style=\"margin:0 0 10px;font-size:18px;font-weight:600;letter-spacing:-0.015em\">Contact leads within five minutes<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6)\">This moves your conversion rate more than anything we can change in the funnel. A lead called in five minutes converts several times better than one called the next day.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;padding:26px 26px 30px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#0031FF;margin-bottom:16px\">03<\u002Fdiv>\n          <h3 style=\"margin:0 0 10px;font-size:18px;font-weight:600;letter-spacing:-0.015em\">Show up to your calls<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6)\">Booked calls only become revenue if someone takes them. Protect the time in your calendar now, before the leads start arriving.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;padding:26px 26px 30px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#0031FF;margin-bottom:16px\">04<\u002Fdiv>\n          <h3 style=\"margin:0 0 10px;font-size:18px;font-weight:600;letter-spacing:-0.015em\">Action the weekly recommendations<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.6;color:rgba(11,12,16,0.6)\">You'll get a numbered list every week. Anything left open is carried over and restated with the date it was first raised — we'd rather repeat ourselves than let a fixable problem run for a month.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section>\n      <h2 style=\"margin:0;font-size:34px;font-weight:700;letter-spacing:-0.03em;line-height:1.1\">How we work together<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:34px\">\n        <div style=\"background:#FFFFFF;border:1px solid rgba(11,12,16,0.09);border-radius:4px;padding:28px 28px 30px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.42);margin-bottom:20px\">Response times<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:18px\">\n            <div>\n              <div style=\"font-size:15px;font-weight:600;margin-bottom:5px\">Us to you<\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58)\">4–6 working hours on anything standard, 1–2 hours if something is broken — funnel not loading, tracking failed, automations not firing. The team is on Monday to Friday, with limited availability at weekends.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding-top:18px;border-top:1px solid rgba(11,12,16,0.09)\">\n              <div style=\"font-size:15px;font-weight:600;margin-bottom:5px\">You to us<\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58)\">48 hours to complete the steps on this page, 24 hours on any review we send you, and 48 hours on the offer blueprint questions. The 7-day launch is consistent, but only when reviews come back on time — a delayed launch eats into your support window.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;border:1px solid rgba(11,12,16,0.09);border-radius:4px;padding:28px 28px 30px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.42);margin-bottom:20px\">Who to tag in Slack<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;justify-content:space-between;gap:16px;align-items:baseline\">\n              <span style=\"font-size:15px;font-weight:600\">George<\u002Fspan>\n              <span style=\"font-size:14px;color:rgba(11,12,16,0.58);text-align:right\">Account and timelines<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding-top:14px;border-top:1px solid rgba(11,12,16,0.09)\">\n              <span style=\"font-size:15px;font-weight:600\">Daniel<\u002Fspan>\n              <span style=\"font-size:14px;color:rgba(11,12,16,0.58);text-align:right\">Strategy and reports<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding-top:14px;border-top:1px solid rgba(11,12,16,0.09)\">\n              <span style=\"font-size:15px;font-weight:600\">Nick<\u002Fspan>\n              <span style=\"font-size:14px;color:rgba(11,12,16,0.58);text-align:right\">GHL, pages and tracking<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding-top:14px;border-top:1px solid rgba(11,12,16,0.09)\">\n              <span style=\"font-size:15px;font-weight:600\">Ilija Kostadinovic<\u002Fspan>\n              <span style=\"font-size:14px;color:rgba(11,12,16,0.58);text-align:right\">Tracking and ad reporting<br><span style=\"color:rgba(11,12,16,0.4)\">goes by Kosta<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:14px 0 0;padding-top:16px;border-top:1px solid rgba(11,12,16,0.09);font-size:14px;line-height:1.6;color:rgba(11,12,16,0.58)\">Not sure who it's for? Just post it in the channel and we'll pick it up.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:2px solid #0B0C10;padding-top:26px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.5)\">Page 1 of 3<\u002Fdiv>\n      <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\">\n        <button type=\"button\" sc-camel-on-click=\"{{ goPage.p2 }}\" style=\"font-family:'Archivo',sans-serif;font-size:15px;font-weight:500;padding:15px 26px;border-radius:3px;border:0;background:#0031FF;color:#FFFFFF;cursor:pointer\" style-hover=\"background:#0B0C10\">Next: what we need from you &nbsp;→<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ page2 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:76px\">\n    <section style=\"border-top:2px solid #0B0C10;padding-top:34px\">\n      <h2 style=\"margin:0;font-size:44px;font-weight:700;letter-spacing:-0.035em;line-height:1.05\">What we need from you<\u002Fh2>\n      <p style=\"margin:18px 0 0;font-size:17px;line-height:1.6;color:rgba(11,12,16,0.62);max-width:60ch\">The build can't start until the access items are done, so the sooner these are cleared the sooner day one actually begins. Tick each one off as you go and let George know in Slack.<\u002Fp>\n      <div style=\"display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:30px;background:#0031FF;color:#FFFFFF;border-radius:4px;padding:22px 26px\">\n        <span style=\"flex:none;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;background:rgba(255,255,255,0.2);padding:7px 11px;border-radius:2px\">48 hours<\u002Fspan>\n        <span style=\"flex:1;min-width:260px;font-size:16px;line-height:1.55;font-weight:500\">Please complete this page and the next within 48 hours of receiving them. Anything still open after that pushes your launch date back day for day.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section>\n      <div style=\"display:flex;gap:22px;align-items:flex-start;margin-bottom:34px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:#0031FF;padding-top:9px;flex:none;letter-spacing:0.06em\">01<\u002Fdiv>\n        <div>\n          <h2 style=\"margin:0;font-size:34px;font-weight:700;letter-spacing:-0.03em;line-height:1.1\">Your agreement<\u002Fh2>\n          <p style=\"margin:16px 0 0;font-size:17px;line-height:1.6;color:rgba(11,12,16,0.62);max-width:58ch\">Your service agreement is ready below, already made out to you. It sets out what is included, what is not, and what each of us is responsible for. Read it, sign it here, and we both keep a copy.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"uo-contract\" data-client=\"Zestful Media &amp; Design\" style=\"background:#FFFFFF;border:1px solid rgba(11,12,16,0.09);border-radius:4px;padding:4px 30px 26px\">\n        <div style=\"display:flex;gap:18px;align-items:flex-start;padding:26px 0 8px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggle.contract }}\" aria-pressed=\"{{ pressed.contract }}\" aria-label=\"{{ boxLabel.contract }}\" style=\"flex:none;position:relative;width:28px;height:28px;margin-top:2px;border:1.5px solid rgba(11,12,16,0.22);border-radius:7px;background:#FFFFFF;cursor:pointer;padding:0\" style-hover=\"border-color:#0031FF\">\n            <span style=\"{{ fill.contract }}\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 15 15\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8 6 11 12 4\" stroke=\"#FFFFFF\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:20px\">\n            <div>\n              <div id=\"uo-contract-title\" style=\"font-size:18px;font-weight:600;letter-spacing:-0.015em;margin-bottom:6px\">Unorthodox Systems — Client Service Agreement<\u002Fdiv>\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(11,12,16,0.5)\">V2.7.2026 &nbsp;·&nbsp; Unorthodox Digital Ltd<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div id=\"uo-contract-details\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px 30px;background:#FBFBFC;border:1px solid rgba(11,12,16,0.09);border-radius:4px;padding:22px 24px\">\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.42)\">Client name<\u002Fdiv>\n                <div style=\"font-size:15px;line-height:1.5\">Megan Harrington<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.42)\">Company<\u002Fdiv>\n                <div style=\"font-size:15px;line-height:1.5\">Zestful Media &amp; Design<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.42)\">Registered address<\u002Fdiv>\n                <div style=\"font-size:15px;line-height:1.5\">1434 Cranesbill Lane<br>Odenton, MD 21113, USA<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.42)\">Email<\u002Fdiv>\n                <div style=\"font-size:15px;line-height:1.5\">hello@zestfulmediadesign.com<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.42)\">Start date<\u002Fdiv>\n                <div style=\"font-size:15px;line-height:1.5\">4 September 2026<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:rgba(11,12,16,0.42)\">Package<\u002Fdiv>\n                <sc-if value=\"{{ adSetup }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:15px;line-height:1.5\">Systems + Ad Setup<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ systemsOnly }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"font-size:15px;line-height:1.5\">Systems<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px\">\n                <div style=\"font-size:15px;font-weight:600\">The agreement<\u002Fdiv>\n                <div class=\"noprint\" style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(11,12,16,0.42)\">Scroll to read in full<\u002Fspan>\n                  <button type=\"button\" sc-camel-on-click=\"{{ downloadPdf }}\" style=\"font-family:'Archivo',sans-serif;font-size:13px;font-weight:500;padding:9px 16px;border-radius:3px;border:1px solid rgba(11,12,16,0.16);background:#FFFFFF;color:#0B0C10;cursor:pointer\" style-hover=\"border-color:#0031FF;color:#0031FF\">Download PDF<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ adSetup }}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"clamp\" style=\"max-height:460px;overflow:auto;border:1px solid rgba(11,12,16,0.12);border-radius:4px;background:#FFFFFF;padding:26px 28px\">\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-top:0\">PURPOSE OF THIS AGREEMENT<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">This Agreement exists to clearly define the responsibilities of both Unorthodox Digital Ltd (\"Unorthodox\") and the Client throughout the implementation of Unorthodox Systems.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Its purpose is not to create unnecessary restrictions or obligations, but to ensure both parties understand what is required for the project to be completed successfully and to the highest possible standard.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Unorthodox Systems is a Done-For-You implementation service that includes the complete Unorthodox Systems build, together with the onboarding of the Client into the Unorthodox advertising management structure. This covers Meta Business Manager setup, compliance and a strategic session with one of our media buying specialists to align the Client's first advertising campaigns.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">This Agreement defines exactly what is included within the service, what is not included, and the responsibilities of both parties during the project.<\u002Fp>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">PROJECT OVERVIEW<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Every Unorthodox Systems engagement begins with a planning and implementation phase. The objective is to understand the Client's offer, ideal customer, sales process and existing marketing before building the required systems and preparing the advertising account.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">The project is delivered in four stages:<\u002Fp>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Stage One — Strategy &amp; Blueprint<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Review of business, offer, positioning and customer journey.<\u002Fli><li style=\"margin:0 0 6px\">Implementation blueprint that forms the foundation for all subsequent assets and advertising campaigns.<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Stage Two — Production<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Video Sales Letter scripting<\u002Fli><li style=\"margin:0 0 6px\">Video editing<\u002Fli><li style=\"margin:0 0 6px\">Funnel design<\u002Fli><li style=\"margin:0 0 6px\">CRM configuration<\u002Fli><li style=\"margin:0 0 6px\">AI implementation<\u002Fli><li style=\"margin:0 0 6px\">Email sequences<\u002Fli><li style=\"margin:0 0 6px\">SMS sequences<\u002Fli><li style=\"margin:0 0 6px\">Tracking systems<\u002Fli><li style=\"margin:0 0 6px\">Creative production<\u002Fli><li style=\"margin:0 0 6px\">Workflow automation<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Stage Three — Implementation<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Assets implemented into the Client's systems and connected together ready for launch.<\u002Fli><li style=\"margin:0 0 6px\">Meta Business Manager, ad account, pixels and Conversion API configured and compliance checked.<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Stage Four — Advertising Onboarding &amp; Handover<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Full system walkthrough<\u002Fli><l ctive campaigns<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Creative<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Fifteen (15) video advertisement scripts<\u002Fli><li style=\"margin:0 0 6px\">Editing guidance<\u002Fli><li style=\"margin:0 0 6px\">Ten (10) static advertisements<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Training<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Full walkthrough of every system<\u002Fli><li style=\"margin:0 0 6px\">Training on operation and management<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Support<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Thirty (30) days Slack support following completion<\u002Fli><\u002Ful>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">WHAT IS NOT INCLUDED<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Unless specifically agreed in writing, the following services are not included within Unorthodox Systems.<\u002Fp>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Ongoing paid advertising management, Meta Ads optimisation, Google Ads optimisation<\u002Fli><li style=\"margin:0 0 6px\">Ongoing media buying, Ongoing campaign management, Advertising spend<\u002Fli><li style=\"margin:0 0 6px\">Ongoing funnel optimisation, Ongoing copywriting<\u002Fli><li style=\"margin:0 0 6px\">Sales coaching<\u002Fli><li style=\"margin:0 0 6px\">Sales management, Appointment setting<\u002Fli><li style=\"margin:0 0 6px\">Lead follow-up by humans<\u002Fli><li style=\"margin:0 0 6px\">Closing sales<\u002Fli><li style=\"margin:0 0 6px\">Product fulfilment<\u002Fli><li style=\"margin:0 0 6px\">Third-party software subscriptions<\u002Fli><li style=\"margin:0 0 6px\">Professional filming, Voice-over talent<\u002Fli><li style=\"margin:0 0 6px\">Photography<\u002Fli><li style=\"margin:0 0 6px\">Graphic design outside the agreed scope<\u002Fli><li style=\"margin:0 0 6px\">Legal, financial or compliance advice<\u002Fli><\u002Ful>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">INVESTMENT<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">The investment for Unorthodox Systems is:<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">The agreed fee is $8,000 USD.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">This fee covers the complete system implementation together with the advertising setup and launch, Meta Business Manager setup, compliance review and specialist strategy call described within this Agreement.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">The split payment option is provided solely as a financing option and does not represent an ongoing monthly service.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">All prices are exclusive of VAT which will be charged where legally required. Failure to make payments when due may result in work being paused until outstanding balances have been settled.<\u002Fp>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">ADVERTISING SETUP AND LAUNCH<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">The advertising element of this Agreement covers the setup, build and launch of the Client's initial Meta advertising campaigns. It is a one-off implementation delivered as part of the fee above and does not constitute ongoing advertising management.<\u002Fp>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Client Requirements<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Provide Unorthodox with partner or admin access to an active Meta Business Manager and the associated ad account, pages and pixels.<\u002Fli><li style=\"margin:0 0 6px\">Maintain an active primary payment card on the ad account at all times, plus a valid backup payment method to prevent campaigns being paused.<\u002Fli><li style=\"margin:0 0 6px\">Fund all advertising spend directly. Advertising spend is paid by the Client to Meta and is never included within the fee.<\u002Fli><li style=\"margin:0 0 6px\">Maintain compliance with Meta's advertising policies and provide any verification or documentation Meta requires.<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">What Setup And Launch Covers<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Meta Business Manager creation or configuration, including ad account, page and pixel permissions.<\u002Fli><li style=\"margin:0 0 6px\">Campaign structure built and configured ready to spend.<\u002Fli><li style=\"margin:0 0 6px\">Advertising compliance review before launch.<\u002Fli><li style=\"margin:0 0 6px\">Campaigns launched and confirmed as delivering.<\u002Fli><li style=\"margin:0 0 6px\">Where the Client already has active campaigns, a full review of the existing ad account.<\u002Fli><\u002Ful>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Once campaigns are live, day-to-day running and optimisation of the ad account remains with the Client.<\u002Fp>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">PROJECT TIMELINES<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Implementation time varies depending upon project complexity and the speed at which required information is supplied.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Typical implementation ranges between 14 and 45 business days, however this is not guaranteed.<\u002Fp>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">VSL recordings<\u002Fli><li style=\"margin:0 0 6px\">Testimonials<\u002Fli><li style=\"margin:0 0 6px\">Branding<\u002Fli><li style=\"margin:0 0 6px\">Account access<\u002Fli><li style=\"margin:0 0 6px\">Feedback<\u002Fli><li style=\"margin:0 0 6px\">Approvals<\u002Fli><li style=\"margin:0 0 6px\">Third-party platform approvals (including Meta Business verification)<\u002Fli><\u002Ful>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">CLIENT RESPONSIBILITIES<\u002Fh3>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Provide Required Information: Supply requested information accurately and promptly.<\u002Fli><li style=\"margin:0 0 6px\">Provide Assets: Provide logos, branding, testimonials, videos and other requested materials.<\u002Fli><li style=\"margin:0 0 6px\">Record Requested Content: Record Video Sales Letters and advertisements where required.<\u002Fli><li style=\"margin:0 0 6px\">Provide Platform Access: Grant access to advertising accounts, Meta Business Manager, domains, CRM systems, calendars and associated software.<\u002Fli><li style=\"margin:0 0 6px\">Advertising Readiness: Maintain a valid primary and backup payment method on the ad account and comply with Meta's advertising policies.<\u002Fli><li style=\"margin:0 0 6px\">Provide Feedback: Review submitted work and provide consolidated feedback within a reasonable timeframe.<\u002Fli><li style=\"margin:0 0 6px\">Approvals: Approve work before implementation.<\u002Fli><li style=\"margin:0 0 6px\">System Integrity: Not materially alter the implemented systems, campaigns or tracking during the build process without discussing changes with Unorthodox.<\u002Fli><\u002Ful>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">COMPLETION OF SERVICES<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">The service shall be deemed practically complete once all agreed deliverables have been supplied, the system walkthrough and specialist advertising call have been delivered, and thirty (30) days of included Slack support have expired. Minor bug fixes discovered during this support period will be corrected without charge. Requests for additional functionality or changes outside the agreed scope may be quoted separately.<\u002Fp>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">OPTIONAL ONGOING SUPPORT<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Following completion, Clients may choose to continue with the Unorthodox Systems Support &amp; Maintenance Plan. Current pricing: $950 USD per month.<\u002Fp>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Technical support<\u002Fli><li style=\"margin:0 0 6px\">Minor system updates<\u002Fli><li style=\"margin:0 0 6px\">Bug fixes<\u002Fli><li style=\"margin:0 0 6px\">AI workflow monitoring<\u002Fli><li style=\"margin:0 0 6px\">Slack support<\u002Fli><li style=\"margin:0 0 6px\">Up to one scheduled support call per month (where applicable)<\u002Fli><\u002Ful>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">REFUNDS<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Due to the bespoke nature of the work undertaken, all payments are non-refundable once work has commenced. The Client acknowledges that significant strategic, technical and creative work begins immediately following onboarding.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">If the Client chooses not to complete the implementation, pauses the project indefinitely, or otherwise elects not to proceed after work has commenced, no refund shall be due for work already completed. Nothing in this Agreement affects the Client's statutory rights where applicable.<\u002Fp>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">LIMITATION OF LIABILITY<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Unorthodox will exercise reasonable skill and care in delivering the services described within this Agreement. However, Unorthodox does not guarantee any specific business outcome, including but not limited to revenue or profit, lead or appointment volume, sales, return on advertising spend, or return on investment. Business performance depends upon numerous factors outside the control of Unorthodox including advertising execution, market conditions, pricing, sales ability, fulfilment quality and operational execution.<\u002Fp>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">INTELLECTUAL PROPERTY<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Upon receipt of all payments due under this Agreement, ownership of the bespoke assets created specifically for the Client (including copy, funnels, workflows and creative assets) transfers to the Client. Unorthodox retains ownership of its proprietary methodologies, templates, frameworks, software configurations, AI systems, internal processes and intellectual property developed independently of the Client's project.<\u002Fp>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">ACCEPTANCE<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">By signing below, or by paying the first invoice, both parties confirm that they have read, understood and agree to the terms contained within this Agreement.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">This Agreement shall be governed by the laws of England and Wales.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ systemsOnly }}\" hint-placeholder-val=\"{{ true }}\">\n                <div class=\"clamp\" style=\"max-height:460px;overflow:auto;border:1px solid rgba(11,12,16,0.12);border-radius:4px;background:#FFFFFF;padding:26px 28px\">\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-top:0\">PURPOSE OF THIS AGREEMENT<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">This Agreement exists to clearly define the responsibilities of both Unorthodox Digital Ltd (\"Unorthodox\") and the Client throughout the implementation of Unorthodox Systems.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Its purpose is not to create unnecessary restrictions or obligations, but to ensure both parties understand what is required for the project to be completed successfully and to the highest possible standard. Unorthodox Systems is a Done-For-You implementation service, designed to build the infrastructure required for a business to consistently generate, qualify and nurture new leads.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">The service focuses on designing and implementing the underlying systems that support client acquisition. While these systems are built using proven frameworks and best practices, their effectiveness ultimately depends upon how they are used by the Client following implementation.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">This Agreement defines exactly what is included within the service, what is not included, and the responsibilities of both parties during the project.<\u002Fp>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">PROJECT OVERVIEW<\u002Fh3>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">Every Unorthodox Systems engagement begins with a planning and implementation phase. The objective is to understand the Client's offer, ideal customer, sales process and existing marketing before building the required systems.<\u002Fp>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.7;color:rgba(11,12,16,0.72)\">The project is delivered in four stages:<\u002Fp>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Stage One — Strategy &amp; Blueprint<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Review of business, offer, positioning and customer journey.<\u002Fli><li style=\"margin:0 0 6px\">Implementation blueprint that forms the foundation for all subsequent assets.<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Stage Two — Production<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Video Sales Letter scripting<\u002Fli><li style=\"margin:0 0 6px\">Video editing<\u002Fli><li style=\"margin:0 0 6px\">Funnel design<\u002Fli><li style=\"margin:0 0 6px\">CRM configuration<\u002Fli><li style=\"margin:0 0 6px\">AI implementation<\u002Fli><li style=\"margin:0 0 6px\">Email sequences<\u002Fli><li style=\"margin:0 0 6px\">SMS sequences<\u002Fli><li style=\"margin:0 0 6px\">Tracking systems<\u002Fli><li style=\"margin:0 0 6px\">Creative production<\u002Fli><li style=\"margin:0 0 6px\">Workflow automation<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Stage Three — Implementation<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Assets implemented into the Client's systems and connected together ready for launch.<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Stage Four — Handover<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Full system walkthrough<\u002Fli><li style=\"margin:0 0 6px\">Training videos<\u002Fli><li style=\"margin:0 0 6px\">Documentation where appropriate<\u002Fli><li style=\"margin:0 0 6px\">Thirty (30) days of Slack support<\u002Fli><\u002Ful>\n              <h3 style=\"margin:30px 0 14px;padding-bottom:9px;border-bottom:1px solid rgba(11,12,16,0.12);font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase\">WHAT IS INCLUDED<\u002Fh3>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Strategy<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li style=\"margin:0 0 6px\">Offer Blueprint<\u002Fli><\u002Ful>\n              <h4 style=\"margin:20px 0 8px;font-size:14px;font-weight:600;letter-spacing:-0.01em\">Video Production<\u002Fh4>\n              <ul style=\"margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.65;color:rgba(11,12,16,0.72)\"><li styl
