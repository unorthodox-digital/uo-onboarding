<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Client Library — Unorthodox</title>
<style>
  :root{
    --bg:#faf9f5; --ink:#0b0c16; --muted:rgba(11,12,22,.52);
    --line:rgba(11,12,22,.12); --brand:#0031FF; --card:#fff;
    --mono:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;padding:48px 24px 96px}
  .wrap{max-width:760px;margin:0 auto}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
           text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  h1{font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.02em;font-weight:700}
  .sub{color:var(--muted);font-size:15px;line-height:1.5;margin-top:12px}

  /* ── gate ─────────────────────────────────────────────── */
  #gate{margin-top:40px;max-width:340px}
  label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
        text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  input{width:100%;font:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--line);
        border-radius:10px;background:var(--card);color:var(--ink)}
  input:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
  button{margin-top:12px;font:inherit;font-size:14px;font-weight:600;padding:12px 22px;
         border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
  button:hover{opacity:.9}
  .err{color:#c0392b;font-size:13px;margin-top:10px;min-height:18px}

  /* ── list ─────────────────────────────────────────────── */
  #app{display:none;margin-top:40px}
  #filter{margin-bottom:20px}
  ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  a.row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
        padding:18px 20px;background:var(--card);border:1px solid var(--line);
        border-radius:12px;text-decoration:none;color:inherit}
  a.row:hover{border-color:var(--brand);box-shadow:0 1px 3px rgba(0,49,255,.12)}
  .name{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .slug{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
  .date{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
  .count{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
         text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  .empty{color:var(--muted);font-size:15px;padding:24px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Unorthodox · Systems</div>
  <h1>Client Library</h1>
  <p class="sub">Every client onboarding page, in one place.</p>

  <form id="gate" autocomplete="off">
    <label for="code">Access code</label>
    <input id="code" type="password" inputmode="text" autocomplete="off" autofocus>
    <button type="submit">Enter</button>
    <div class="err" id="err" role="alert"></div>
  </form>

  <main id="app">
    <div class="count" id="count"></div>
    <input id="filter" type="search" placeholder="Filter by client name or slug…" aria-label="Filter clients">
    <ul id="list"></ul>
  </main>
</div>

<script>
/* Change this to whatever code the team should use.
   Note: this is client-side only — anyone who views source can read it.
   It keeps casual visitors out; it is not a security boundary. */
var ACCESS_CODE = "unorthodox";

var KEY = "uo-library-ok";
var gate = document.getElementById("gate");
var app  = document.getElementById("app");
var err  = document.getElementById("err");

function unlock(){
  gate.style.display = "none";
  app.style.display  = "block";
  load();
}

if (sessionStorage.getItem(KEY) === "1") unlock();

gate.addEventListener("submit", function(e){
  e.preventDefault();
  if (document.getElementById("code").value.trim() === ACCESS_CODE){
    sessionStorage.setItem(KEY, "1");
    unlock();
  } else {
    err.textContent = "Not quite — check the code and try again.";
  }
});

var all = [];

function render(items){
  var list = document.getElementById("list");
  list.innerHTML = "";
  if (!items.length){
    list.innerHTML = '<li class="empty">No client pages match.</li>';
    return;
  }
  items.forEach(function(p){
    var a = document.createElement("a");
    a.className = "row";
    a.href = "/" + p.slug + "/";
    var left = document.createElement("div");
    var nm = document.createElement("div");
    nm.className = "name";
    nm.textContent = p.clientName || p.slug;
    var sl = document.createElement("div");
    sl.className = "slug";
    sl.textContent = "/" + p.slug + "/";
    left.appendChild(nm); left.appendChild(sl);
    var dt = document.createElement("div");
    dt.className = "date";
    dt.textContent = p.publishedAt || "";
    a.appendChild(left); a.appendChild(dt);
    var li = document.createElement("li");
    li.appendChild(a);
    list.appendChild(li);
  });
}

function load(){
  fetch("pages.json", { cache: "no-store" })
    .then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(data){
      all = Array.isArray(data) ? data.slice() : [];
      all.sort(function(a,b){
        return (a.clientName || a.slug || "").localeCompare(b.clientName || b.slug || "");
      });
      document.getElementById("count").textContent =
        all.length + (all.length === 1 ? " client" : " clients");
      render(all);
    })
    .catch(function(e){
      document.getElementById("list").innerHTML =
        '<li class="empty">Could not load the client list (' + e.message + ').</li>';
    });
}

document.getElementById("filter").addEventListener("input", function(e){
  var q = e.target.value.trim().toLowerCase();
  render(!q ? all : all.filter(function(p){
    return ((p.clientName || "") + " " + p.slug).toLowerCase().indexOf(q) !== -1;
  }));
});
</script>
</body>
</html>
