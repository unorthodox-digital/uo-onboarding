<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Client Library — Unorthodox</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --bg:#0a0e16;
    --panel:#131a25;
    --panel-hi:#18202d;
    --line:rgba(255,255,255,.09);
    --ink:#e9eff7;
    --muted:#8b97a8;
    --brand:#2f6bfa;
    --brand-hi:#4880ff;
    --danger:#f87171;
    --mono:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;padding:56px 24px 96px}
  .wrap{max-width:860px;margin:0 auto}

  header{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}
  .glyph{width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:var(--brand);
         display:flex;align-items:center;justify-content:center;font-family:var(--mono);
         font-size:13px;font-weight:700;color:#fff;margin-top:3px}
  h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;font-weight:700}
  .sub{color:var(--muted);font-size:15px;line-height:1.5;margin:6px 0 0 42px}

  .toolbar{display:flex;align-items:center;gap:12px;margin:32px 0 22px}
  #filter{flex:1;font:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--line);
          border-radius:10px;background:var(--panel);color:var(--ink)}
  #filter::placeholder{color:var(--muted)}
  #filter:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,107,250,.22)}
  .count{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
         font-weight:600;white-space:nowrap;padding:0 4px}
  .sect{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
        font-weight:600;margin-bottom:12px}
  ul{list-style:none;display:flex;flex-direction:column;gap:12px}
  .card{position:relative;background:var(--panel);border:1px solid var(--line);
        border-radius:12px;padding:20px 56px 20px 22px}
  .card:hover{background:var(--panel-hi);border-color:rgba(47,107,250,.45)}
  .card[aria-busy="true"]{opacity:.5;pointer-events:none}
  .name{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .meta{display:flex;align-items:center;gap:10px;margin-top:7px;flex-wrap:wrap}
  .slug{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;
        background:rgba(47,107,250,.16);color:#8fb4ff;white-space:nowrap}
  .open{display:inline-block;margin-top:15px;font-size:13.5px;font-weight:600;
        padding:9px 16px;border-radius:9px;background:var(--brand);color:#fff;text-decoration:none}
  .open:hover{background:var(--brand-hi)}

  .remove{position:absolute;top:14px;right:14px;width:30px;height:30px;padding:0;
          display:flex;align-items:center;justify-content:center;font:inherit;
          font-size:18px;line-height:1;border:1px solid transparent;border-radius:8px;
          background:transparent;color:var(--muted);cursor:pointer}
  .remove:hover{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.4);
                color:var(--danger)}
  .remove:focus-visible{outline:2px solid var(--danger);outline-offset:1px}

  .empty{color:var(--muted);font-size:15px;padding:26px 0}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
         max-width:min(560px,92vw);background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:13px 18px;font-size:14px;line-height:1.45;
         box-shadow:0 6px 24px rgba(0,0,0,.45);display:none}
  #toast.show{display:block}
  #toast.bad{border-color:rgba(248,113,113,.5);color:var(--danger)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="glyph">UO</div>
    <div><h1>Client Library</h1></div>
  </header>
  <p class="sub">Every client onboarding page, one click away.</p>

  <div class="toolbar">
    <input id="filter" type="search" placeholder="Search clients…" aria-label="Search clients">
    <div class="count" id="count"></div>
  </div>
  <div class="sect">Client onboarding pages</div>
  <ul id="list"></ul>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* No password logic here by design. Access is enforced server-side by the
   middleware, and removal by api/remove-page.ts, which re-checks the same cookie
   because the middleware does not match /api/*.
   Do not reintroduce a client-side code check — it would be readable in
   view-source and would add nothing. */

var all = [];

function toast(message, bad){
  var el = document.getElementById("toast");
  el.textContent = message;
  el.className = bad ? "show bad" : "show";
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.className = ""; }, 7000);
}

function setCount(n){
  document.getElementById("count").textContent = n + (n === 1 ? " client" : " clients");
}

function removePage(entry, card){
  if (!confirm(
    "Remove " + (entry.clientName || entry.slug) + "?\n\n" +
    "/" + entry.slug + "/ will stop working and the page will be deleted from " +
    "the repository. Any link already sent to this client will break."
  )) return;

  card.setAttribute("aria-busy", "true");
  fetch("/api/remove-page", {
    method: "POST",
    headers: { "content-type": "application/json" },
    credentials: "same-origin",
    body: JSON.stringify({ slug: entry.slug })
  })
    .then(function(r){
      return r.json()
        .catch(function(){ return {}; })
        .then(function(body){ return { ok: r.ok, body: body }; });
    })
    .then(function(res){
      if (!res.ok) throw new Error(res.body.error || "Removal failed.");
      all = all.filter(function(p){ return p.slug !== entry.slug; });
      setCount(all.length);
      card.parentNode.remove();
      if (!document.querySelectorAll(".card").length){
        document.getElementById("list").innerHTML =
          '<li class="empty">No client pages yet.</li>';
      }
      toast("Removed " + entry.slug + ". The site is rebuilding — the page goes " +
            "offline in about a minute.");
    })
    .catch(function(e){
      card.removeAttribute("aria-busy");
      toast(e.message, true);
    });
}

function render(items){
  var list = document.getElementById("list");
  list.innerHTML = "";
  if (!items.length){
    list.innerHTML = '<li class="empty">No client pages match.</li>';
    return;
  }
  items.forEach(function(p){
    var card = document.createElement("div");
    card.className = "card";

    var nm = document.createElement("div");
    nm.className = "name";
    nm.textContent = p.clientName || p.slug;

    var meta = document.createElement("div");
    meta.className = "meta";
    var sl = document.createElement("span");
    sl.className = "slug";
    sl.textContent = "/" + p.slug + "/";
    meta.appendChild(sl);
    if (p.publishedAt){
      var pill = document.createElement("span");
      pill.className = "pill";
      pill.textContent = "Added " + p.publishedAt;
      meta.appendChild(pill);
    }

    var a = document.createElement("a");
    a.className = "open";
    a.href = "/" + p.slug + "/";
    a.textContent = "Open the page";

    var x = document.createElement("button");
    x.className = "remove";
    x.type = "button";
    x.textContent = "×";
    x.title = "Remove this page";
    x.setAttribute("aria-label", "Remove " + (p.clientName || p.slug));
    x.addEventListener("click", function(){ removePage(p, card); });

    card.appendChild(nm);
    card.appendChild(meta);
    card.appendChild(a);
    card.appendChild(x);

    var li = document.createElement("li");
    li.appendChild(card);
    list.appendChild(li);
  });
}

fetch("pages.json", { cache: "no-store" })
  .then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(function(data){
    all = Array.isArray(data) ? data.slice() : [];
    all.sort(function(a,b){
      return (a.clientName || a.slug || "").localeCompare(b.clientName || b.slug || "");
    });
    setCount(all.length);
    render(all);
  })
  .catch(function(e){
    document.getElementById("list").innerHTML =
      '<li class="empty">Could not load the client list (' + e.message + ').</li>';
  });

document.getElementById("filter").addEventListener("input", function(e){
  var q = e.target.value.trim().toLowerCase();
  render(!q ? all : all.filter(function(p){
    return ((p.clientName || "") + " " + p.slug).toLowerCase().indexOf(q) !== -1;
  }));
});
</script>
</body>
</html>
